---
name: CI
on:
  push:
  pull_request:

jobs:
  # Lint + syntax on a modern ansible-core (needed by ansible-lint).
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint
      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check main playbook
        run: ansible-playbook site.yml -i inventory/hosts.yml --syntax-check
      - name: Syntax check restore-test playbook
        run: >
          ansible-playbook restore-test/monthly-restore.yml
          -e client=example-client --syntax-check
      - name: Lint
        run: ansible-lint

  # Representative of a real server: distro-packaged Ansible (Ubuntu
  # 24.04 -> ansible-core 2.16) with the PINNED collections. This is the
  # environment that catches "module/collection does not exist on the
  # version people actually have installed" bugs, which a latest-only CI
  # silently passes.
  distro-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distro Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible
          ansible --version
      - name: Install pinned Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check with distro ansible-core
        run: ansible-playbook site.yml -i inventory/hosts.yml --syntax-check
      - name: Syntax check restore-test playbook
        run: >
          ansible-playbook restore-test/monthly-restore.yml
          -e client=example-client --syntax-check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check detector templates
        run: |
          mkdir -p /tmp/pyc
          for f in roles/09-watcher/templates/*.py.j2; do
            out="/tmp/pyc/$(basename "${f%.j2}")"
            sed 's/{{[^}]*}}/PLACEHOLDER/g' "$f" > "$out"
          done
          python -m py_compile /tmp/pyc/*.py

      - name: Compile-check the CVE scanner
        run: python -m py_compile roles/11-cve-watch/files/cve_watch.py

      - name: CVE scanner smoke test (lockfile parsing, offline)
        run: |
          mkdir -p /tmp/cvefix
          cat > /tmp/cvefix/package-lock.json <<'EOF'
          {"lockfileVersion":3,"packages":{
            "":{"name":"x","version":"1.0.0"},
            "node_modules/lodash":{"version":"4.17.15"},
            "node_modules/mocha":{"version":"9.0.0","dev":true}}}
          EOF
          # Network may be unavailable; we only assert it parses and
          # reports the lockfile without crashing.
          python roles/11-cve-watch/files/cve_watch.py \
            --scan-dir /tmp/cvefix --json > /tmp/out.json || true
          python - <<'PY'
          import json
          d = json.load(open("/tmp/out.json"))
          assert any("package-lock.json" in s for s in d["scanned"]), d
          assert "2 packages" in d["scanned"][0], d["scanned"]  # dev dep excluded
          print("scanner smoke test OK:", d["scanned"])
          PY

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh
