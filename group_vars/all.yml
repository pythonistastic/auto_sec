---
# Global defaults. Override per server in host_vars/<server>.yml.
#
# Every server needs ONE line in its host_vars. It has no default: the run
# stops until it is set.
#   autosec_server: existing   a server that already runs something.
#                              auto_sec changes nothing unless you name it.
#   autosec_server: new        a brand-new server. auto_sec turns on ufw,
#                              fail2ban and automatic updates, and creates
#                              the admin account.
# The settings marked "follows autosec_server" below take their default
# from it. Set them in host_vars to choose yourself.

# --- The run plan ---------------------------------------------------------
# Every run prints a plan before it changes anything: one line per role,
# the totals and a plan id.
# true: a run that would change this server needs your OK, given as
# -e autosec_approve=<plan id>. A run that changes nothing needs none.
autosec_require_approval: false
# One-off switch: pass with -e on one run, never in host_vars. true prints
# the plan and stops before anything changes.
autosec_plan_only: false
# Also -e only: autosec_confirm_hosts=<n> lets a run over n hosts go without
# -l; autosec_serial=<n> runs n hosts at a time (default 1).

deploy_user: "deploy"

# --- The admin account (role 01) ------------------------------------------
#   keep:   auto_sec creates no account and writes no sudo rule.
#   create: create deploy_user if it does not exist (home, shell /bin/bash,
#           password locked: key login only, no extra groups), and give it
#           passwordless sudo in auto_sec's own /etc/sudoers.d/<deploy_user>.
#           The run stops if that file is yours, or if your sudo rules
#           already name the account or one of its groups.
# An existing account is never changed (shell, groups, home, password).
# Follows autosec_server: create with new when deploy_user is also
# ssh_admin_user (and not root), else keep.
deploy_user_account: "{{ 'create' if ((autosec_server | default('') | string) == 'new' and (ssh_admin_user | default(deploy_user)) == deploy_user and deploy_user != 'root') else 'keep' }}"

# --- Updates, reboots, hostname, timezone (role 01) -----------------------
# auto_sec writes at most one apt file,
# /etc/apt/apt.conf.d/51autosec-unattended-upgrades, and only when a
# setting below asks for something (with the defaults it writes none). It
# never edits the distro's 20auto-upgrades or 50unattended-upgrades (one
# exception, only with -e apt_migrate_unattended_upgrades=true: on a host
# set up by auto_sec 0.1-0.4 it puts the distro's 50unattended-upgrades
# back once). Your own 52unattended-upgrades-local is read after auto_sec's
# file and wins; the run stops if it would cancel a choice made here.
# keep = leave it as the server has it. auto_sec 0.6 writes no kernel
# settings (the lines 0.1-0.5 put in /etc/sysctl.conf are yours now).

# Hostname: keep, or a lowercase hostname/FQDN (at most 64 characters).
# Nothing in auto_sec needs it: reports, alerts and backups use the
# inventory name. A mail server announces this name; the run refuses to
# change it while something listens on port 25, 465 or 587.
server_hostname: keep

# Timezone: keep, or a name the server knows (timedatectl list-timezones),
# e.g. "UTC" or "Europe/Berlin". A change moves every cron job and timer
# that runs at a clock time; the run lists them first. (0.4 set "UTC".)
timezone: keep

# Automatic security updates (unattended-upgrades):
#   auto: install unattended-upgrades if it is missing; its own setup turns
#         the updates on. auto_sec writes no switch of its own, so the
#         distro's switch keeps working (dpkg-reconfigure
#         unattended-upgrades, 20auto-upgrades). If the server has them off,
#         or unattended-upgrades was removed, they stay off and the run
#         prints a WARNING.
#   true: turn them on and keep them on (auto_sec's file sets both
#         switches to "1", daily, whatever 20auto-upgrades says)
#   keep: leave them as they are (auto_sec does not even install
#         unattended-upgrades)
# auto_sec never turns them off ("false" is refused).
# Follows autosec_server: auto with new, keep with existing.
unattended_upgrades_enabled: "{{ 'auto' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# Automatic reboot after an update that needs one (a new kernel):
#   keep:  auto_sec does not touch it (off unless you or the distro turned
#          it on; the run warns when it is on)
#   true:  reboot at unattended_reboot_time, in the server's own timezone
#   false: never reboot automatically
# Updates run at about 06:00-07:00; a time already past that day means the
# next day.
unattended_automatic_reboot: keep
# Required with true, QUOTED (unquoted, YAML reads 03:30 as a number):
# unattended_reboot_time: "03:30"

# Which archives the automatic updates install from:
#   keep:     leave the distro's (or your) origin list alone
#   security: security archives only (on Ubuntu also the release pocket,
#             which security fixes need for new dependencies)
unattended_origins: keep

# true: never update the Docker packages automatically (docker-ce,
# docker-ce-cli, docker-ce-rootless-extras, docker-buildx-plugin,
# docker-compose-plugin, containerd.io, docker.io, containerd). A Docker
# update restarts the Docker service and every container.
unattended_exclude_docker: false

# More packages the automatic updates must never touch: exact package
# names, no patterns, e.g. ["nginx", "postgresql-16"]. Added to the list
# of the other files; nothing is removed from it.
unattended_upgrade_blacklist: []

# One-off switch: pass with -e on one run, never in host_vars. true runs
# `apt-get dist-upgrade` (all waiting updates; it can restart services and
# a new kernel needs a reboot). Without it, auto_sec only installs the
# packages a feature you chose needs, without their recommendations, and
# stops if that would upgrade or remove an installed package; the nightly
# automatic updates do the rest.
apt_full_upgrade: false

# One-off switch: pass with -e on one run, never in host_vars. On a server
# set up by auto_sec 0.1-0.4 (its 50unattended-upgrades is still exactly
# 0.1-0.4's file, with automatic reboots at 04:00), the run stops and shows
# what putting the distro's file back changes. true keeps a copy in
# /var/lib/auto-sec/backup/ and puts the distro's file back.
apt_migrate_unattended_upgrades: false

# --- SSH (role 02) --------------------------------------------------------
# auto_sec writes only /etc/ssh/sshd_config.d/00-autosec.conf. It never
# touches the main sshd_config or other drop-ins, and never moves the port.
# Every sshd yes/no value (the login choices, ssh_extra_settings) must be
# QUOTED: an unquoted no becomes false and the preflight stops with
# "quote it", e.g. "no".

# The port sshd ALREADY listens on. auto_sec checks it, but never moves
# sshd. To move the port, follow docs/ssh-port.md.
ssh_port: 22

# false: role 02 writes nothing. The read-only SSH checks still run.
ssh_hardening_enabled: true

# The account you and Ansible log in as. Its keys are added and tested on
# a fresh connection. Stricter login rules are applied only on a run where
# Ansible really is logged in as this user (set ansible_user to match).
# If it is not root, it must exist, or deploy_user_account: create must
# create it (then it must be deploy_user).
ssh_admin_user: "{{ deploy_user }}"

# Public key lines for ssh_admin_user ("ssh-ed25519 AAAA... comment", no
# options). Only added, never removed. deploy_ssh_public_key and
# ssh_public_key_file still work: always installed for deploy_user.
ssh_admin_public_keys: []

# The two login choices have NO default on purpose: the run stops until you
# set both in host_vars (the wizard asks). auto_sec never writes "yes".
#   ssh_permit_root_login:       keep | prohibit-password | "no"
#   ssh_password_authentication: keep | "no"
# keep = leave the server's current setting alone. Stage 1 is keep/keep;
# tighten per host later, after every client (e.g. VS Code) uses a key.

# AllowUsers list. Empty = no AllowUsers line. If set, it must contain
# ssh_admin_user.
ssh_allow_users: []

# Optional extra sshd settings. Empty = leave them as the server has them.
# Allowed keys: MaxAuthTries LoginGraceTime MaxSessions X11Forwarding
# AllowAgentForwarding AllowTcpForwarding ClientAliveInterval
# ClientAliveCountMax LogLevel. Example: { MaxAuthTries: 4, X11Forwarding: "no" }
# (ssh_max_auth_tries is gone: use ssh_extra_settings.MaxAuthTries.)
ssh_extra_settings: {}

# One-off switches. Pass them with -e on a single run, never in host_vars.
#   ssh_migrate_sshd_config: lets role 02 bring back the Include line in a
#     main sshd_config written by auto_sec 0.1-0.3 (or another tool).
#   ssh_accept_unrequested_changes: lets one run continue when a login
#     setting you did not set would change.
ssh_migrate_sshd_config: false
ssh_accept_unrequested_changes: false

# At most this many hosts get an SSH change in one batch. Hosts run one at
# a time (autosec_serial), so this matters only with -e autosec_serial > 1.
# The undo window (ssh_revert_seconds, default 300) is a role 02 default.
ssh_max_hosts_per_run: 5

# Your office/home static IP (break-glass). auto_sec uses it only where it
# writes: in ignoreip of its fail2ban file (fail2ban_hardening_enabled:
# true), and, when this run turns ufw on, in a rule above every other that
# lets it reach SSH without the rate limit. With keep, or on a ufw that is
# already on, add it to your own jail.local and ufw rules. Must be YOUR
# address, not the server's. Set to empty string to disable.
office_static_ip: ""

# More fixed IPs/CIDRs fail2ban must never ban, e.g.
# ["203.0.113.7", "198.51.100.0/24"]. Together with office_static_ip they
# go to ignoreip in [DEFAULT] of jail.d/00-autosec.conf (only with
# fail2ban_hardening_enabled: true). An ignoreip of your own (jail.local)
# replaces that list; the run warns when one of these addresses is then
# missing.
fail2ban_ignore_ips: []

# --- Firewall: ufw (role 03) ----------------------------------------------
# auto_sec runs no ufw command on a ufw that is already on: it adds,
# changes, reorders and restarts nothing there. It turns ufw on only when
# ufw is off and firewall_state is enabled, after its checks, with an
# automatic undo, and keeps it on only if a brand-new SSH login works.
#   keep:    leave ufw as it is, on or off
#   enabled: turn an inactive ufw on; installs ufw if it is missing
# Follows autosec_server: enabled with new, keep with existing.
firewall_state: "{{ 'enabled' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# The SSH rule added when this run turns ufw on and no rule of yours lets
# ssh_port in from every address: limit (rate-limited), allow, or keep
# (add none: then a rule of yours must let SSH in).
firewall_ssh_rule: limit

# Ports to let in when this run turns ufw on (at most 64 items). Nothing
# else is let in: 80 and 443 are no longer opened by default.
#   - { port: 443 }                          # tcp from anywhere (allow)
#   - { port: 51820, proto: udp }
#   - { port: "6000:6010", proto: tcp }       # a range needs proto
#   - { port: 5432, from: "203.0.113.0/24" }  # one address or network
#   - { port: 25, rule: limit }               # allow (default) or limit
# On a ufw that is already on, nothing is added: the run prints the
# `sudo ufw ...` line for each item it does not find.
firewall_inbound: []

# Ports that listen now and may close when this run turns ufw on, e.g.
# ["3000/tcp"]. A listening port that is neither here nor let in stops
# the turn-on.
firewall_closed_ok: []

# Seconds the automatic undo waits for the brand-new SSH login after ufw
# is turned on (120-3600).
firewall_revert_seconds: 300

# Outgoing traffic.
#   false: leave the outgoing policy as it is (0.1-0.5 set it to allow).
#   true:  when this run turns ufw on, allow out only DNS, NTP, HTTP and
#          HTTPS (plus egress_allow_extra) and deny the rest. On a ufw that
#          is already on, auto_sec changes nothing; the run stops and prints
#          the commands if outgoing traffic is still allowed there.
# It can break apps that call outside services on other ports.
egress_lockdown: false
# Extra outbound ports for egress_lockdown, e.g.
#   - { port: 587, proto: tcp }   # SMTP submission
egress_allow_extra: []

# --- fail2ban (role 03) ---------------------------------------------------
# auto_sec writes only /etc/fail2ban/jail.d/00-autosec.conf, never
# jail.local. fail2ban reads it first, so any value YOUR files set wins.
# fail2ban is reloaded only when its effective config changes.
#   keep: leave fail2ban alone: no install, no file, no reload. "false"
#         means the same.
#   true: install fail2ban if missing (it then starts and bans), write
#         00-autosec.conf, reload only on an effective change.
# Follows autosec_server: true with new, keep with existing.
fail2ban_hardening_enabled: "{{ 'true' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# fail2ban [DEFAULT] values. They apply to every jail that sets none of its
# own; if one would change a jail of yours, the run stops and names it.
# Setting this replaces the whole mapping. {} = auto_sec sets none.
# Allowed keys: bantime findtime maxretry bantime.increment bantime.factor
# bantime.maxtime bantime.rndtime backend
fail2ban_defaults:
  bantime: "1h"
  bantime.increment: true
  bantime.factor: 2
  findtime: "10m"
  maxretry: 4

# One-off switch: pass with -e on one run, never in host_vars. Moves a
# jail.local written by auto_sec 0.1-0.4 to /var/lib/auto-sec/fail2ban/.
fail2ban_migrate_jail_local: false

# For role 05 only (app_type set): the nginx-http-auth and nginx-botsearch
# jails, in jail.d/00-autosec-nginx.conf, once nginx is installed. Role 03
# never adds nginx jails, so a host without nginx gets none.
fail2ban_nginx_jails: true

# Paranoia: standard | high. high adds fwknop (Single Packet Authorization)
# and then needs fwknop_pcap_intf (the interface fwknopd listens on, e.g.
# "eth0"). SSH stays visible (rate-limited) in both modes; hiding SSH
# behind fwknop returns in a later release.
paranoia_level: "standard"

# Backups
backup_hour: "3"
backup_minute: "15"
backup_retention_daily: 7
backup_retention_weekly: 4
backup_retention_monthly: 6

# Alerts (Telegram bot): backup status and the CVE watch.
telegram_bot_token: "CHANGE_ME"
telegram_chat_id: "CHANGE_ME"

# Your app's folder on the server. The CVE watch scans it for lockfiles
# (it must exist when cve_watch_enabled is true, unless layer 05 creates
# it in the same run); roles 05 and 07 use it.
app_dir: "/opt/app"

# Detection (roles 08 and 09) is not managed in 0.6: the 0.1-0.5 detectors
# did not work as documented (issue #18). auto_sec installs nothing there
# and warns when old detectors are still on a server. Their variables
# (watcher_*, revshell_*, recon_*, ssh_pattern_watcher_enabled) do nothing
# in 0.6; the run lists them when they are set. Detection returns,
# rewritten, in 0.7.

# --- CVE watch (role 11) -------------------------------------------------
# Off by default. When on, it adds a daily root timer that reads the
# lockfiles in app_dir and sends the names and versions of those packages
# to api.osv.dev, plus a count of unapplied OS security updates. Alerts
# with the exact fix. It never upgrades anything by itself, because the
# source of truth for app dependencies is your git repo. See
# scripts/cve-pr.sh to turn findings into a pull request.
cve_watch_enabled: false
# low | moderate | high | critical. Starts at 'high' deliberately: a
# first scan of a real app can surface dozens of findings, and an alert
# channel nobody reads is worse than no alert. Lower it after triage.
cve_watch_min_severity: "high"
cve_watch_include_dev: false     # dev-only deps are not shipped
cve_watch_include_os: true       # also count pending OS security updates
cve_watch_scan_on_deploy: true   # one scan right after setup
cve_watch_max_alert_items: 10    # per alert; full list always on disk
cve_watch_hour: 6                # daily, local time, +random <1h

# Let's Encrypt registration email for certbot
letsencrypt_email: "CHANGE_ME@example.com"

# Name that appears on the generated security report ("Your Company" is
# left out of the report).
report_prepared_by: "Your Company"
