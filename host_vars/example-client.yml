---
# Per-server configuration. Copy to host_vars/<server>.yml and fill in.
# This example is a NEW server with a web app, a database and backups.
# For a server that already runs something, see "An existing server" at
# the end of this file.

# --- The one required line --------------------------------------------------
#   existing: a server that already runs something. auto_sec changes
#             nothing unless you name it below.
#   new:      a brand-new server. auto_sec turns on ufw (with the ports in
#             firewall_inbound), fail2ban and automatic updates, and creates
#             the admin account (deploy_user) with passwordless sudo.
autosec_server: new

# Every run prints a plan first. With true, a run that would change this
# server needs your OK: -e autosec_approve=<plan id from the plan>.
autosec_require_approval: false

client_name: "Example Client LLC"
client_domain: "app.example.com"
# Required when app_type is set (certbot uses it). Preflight refuses to
# run if this is left as the CHANGE_ME default.
letsencrypt_email: "ops@example.com"

# standard | high. high adds fwknop and needs fwknop_pcap_intf. SSH stays
# visible (rate-limited) in both modes. Hiding SSH returns in a later release.
paranoia_level: "high"
# The network interface fwknopd listens on (`ip route` shows it after "dev").
fwknop_pcap_intf: "eth0"

# Break-glass: the fixed IP you connect FROM (office/home). On this new
# server it reaches SSH without the rate limit (when auto_sec turns ufw on)
# and auto_sec's fail2ban file never bans it. On an existing server with
# keep, add it to your own rules. Never the server's own IP (the run
# refuses that). "" = off.
office_static_ip: ""
# More fixed IPs/CIDRs fail2ban must never ban.
# fail2ban_ignore_ips: ["198.51.100.7"]

# --- Firewall: ufw (role 03) ---------------------------------------------
# With autosec_server: new, auto_sec turns an inactive ufw on: incoming
# traffic is denied except SSH and the ports below. It runs no ufw command
# on a ufw that is already on. A web app needs 80 and 443:
firewall_inbound:
  - { port: 80 }
  - { port: 443 }
# A mail server would add, for example:
#  - { port: 25 }
#  - { port: 587 }
#  - { port: 993 }
# A port that listens now but may close when ufw comes on (the run stops
# and names any other listening port):
firewall_closed_ok: ["3000/tcp"]   # the app itself; nginx serves it on 443
# firewall_ssh_rule: limit          # limit (default) | allow | keep
# firewall_state: enabled           # the default with new; keep = leave ufw alone

# Egress lockdown: default-deny outbound when ufw is turned on. Off unless
# you know the app's outbound needs.
egress_lockdown: false
# egress_allow_extra:
#   - { port: 587, proto: tcp }

# --- fail2ban (role 03) ------------------------------------------------
# auto_sec writes only /etc/fail2ban/jail.d/00-autosec.conf. Your own
# jail.local is never touched, and every value it sets wins.
# fail2ban_hardening_enabled: true    # the default with new; keep = leave it alone
# fail2ban_defaults: {}               # auto_sec sets no fail2ban values

# --- Account, updates, reboots, hostname, timezone (role 01) ------------
# deploy_user_account: create        # the default with new (deploy_user
#                                    # is the admin); keep = no account
# unattended_upgrades_enabled: auto  # the default with new; true | keep
# server_hostname: app.example.com   # default keep
# timezone: "UTC"                    # default keep
# Automatic reboot when an update needs one. Off unless you choose it:
# unattended_automatic_reboot: true  # keep (default) | true | false
# unattended_reboot_time: "03:30"    # required with true; QUOTE it
# unattended_exclude_docker: true    # never update Docker automatically
# unattended_upgrade_blacklist: ["nginx"]
# unattended_origins: security       # default keep

# --- SSH login (role 02) -----------------------------------------------
# Quote every yes/no value: an unquoted no becomes false and the run
# stops with "quote it".
#
# The account you and Ansible log in as (set ansible_user to the same
# name in the inventory). Its keys are only ever added, never removed,
# and are tested on a fresh connection before anything gets stricter.
ssh_admin_user: "deploy"
ssh_admin_public_keys:
  - "ssh-ed25519 AAAA...REPLACE-WITH-YOUR-PUBLIC-KEY you@laptop"

# Stage 1: change nothing about logins. Safe first run on any server.
ssh_permit_root_login: keep
ssh_password_authentication: keep

# Stage 2, later, per host: once every client you use (VS Code included)
# logs in with a key, replace the two lines above with:
#   ssh_permit_root_login: prohibit-password    # or "no" (needs a non-root ssh_admin_user)
#   ssh_password_authentication: "no"
# The key test must pass first, or nothing is changed.

# Optional (defaults shown in group_vars/all.yml):
# ssh_allow_users: ["deploy"]         # must contain ssh_admin_user
# ssh_extra_settings: { MaxAuthTries: 4, X11Forwarding: "no" }
# ssh_port: 22                        # the port sshd ALREADY uses; never moved

# App runtime: node | docker (layer 05 sets up a NEW web server; on a
# server whose nginx was installed before, the run stops)
app_type: "node"
app_dir: "/opt/app"
app_port: 3000
node_version: "20"

# Database: postgres | mysql (omit db_engine entirely for no DB)
db_engine: "postgres"
db_name: "appdb"
db_user: "appuser"
# Store the real password in ansible-vault, this is a placeholder
db_password: "CHANGE_ME_USE_VAULT"

# Backblaze B2 (application key scoped: read + write, NO delete)
b2_bucket: "client-backups-example"
b2_key_id: "CHANGE_ME"
b2_app_key: "CHANGE_ME_USE_VAULT"

# age public key for client-side backup encryption.
# Private key stays in your vault, NEVER on the server.
age_public_key: "age1CHANGEME..."

# fwknop (only used when paranoia_level is high)
fwknop_key: "CHANGE_ME_USE_VAULT"
fwknop_hmac_key: "CHANGE_ME_USE_VAULT"
fwknop_open_seconds: 30

# CVE watch (role 11). Off by default. When on, it adds a daily root
# timer that reads the lockfiles in app_dir (which must exist, or be
# created by layer 05 in the same run, as here) and sends the package
# names and versions to api.osv.dev. It never upgrades anything;
# scripts/cve-pr.sh turns findings into a PR against your repo.
cve_watch_enabled: true
cve_watch_min_severity: "high"   # low | moderate | high | critical
# cve_watch_include_dev: false   # dev-only deps are not shipped
# cve_watch_hour: 6              # daily scan hour (local time)

# Detection (roles 08/09) is not managed in 0.6 (issue #18), so there are
# no watcher_* or revshell_* settings here any more.

# --- An existing server ---------------------------------------------------
# A server that already runs something (the auto_sec canary, for example)
# starts like this. Every value "existing" picks is written out, so the
# choice is visible:
#
#   autosec_server: existing
#   autosec_require_approval: true    # a run that would change something
#                                     # needs -e autosec_approve=<id>
#   deploy_user_account: keep         # no deploy account; root is the admin
#   unattended_upgrades_enabled: keep
#   fail2ban_hardening_enabled: keep  # your jail.local stays in charge
#   firewall_state: keep              # auto_sec runs no ufw command
#   cve_watch_enabled: false
#   ssh_admin_user: root
#   ssh_admin_public_keys: ["ssh-ed25519 AAAA... you@laptop"]
#   ssh_permit_root_login: keep
#   ssh_password_authentication: keep
#
# Then: ansible-playbook -i inventory/<server>.yml site.yml -l <server> -e autosec_plan_only=true
