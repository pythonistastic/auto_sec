---
# Example inventory. The wizard writes one file per server
# (inventory/<server>.yml, gitignored). Always run with -l <server>: a run
# over several hosts without -l stops before it connects anywhere, and
# hosts run one at a time.
all:
  children:
    clients:
      hosts:
        example-client:
          ansible_host: 203.0.113.10
          # Log in as ssh_admin_user (host_vars). Stricter SSH settings
          # are applied only on a run where Ansible really is this user;
          # otherwise they are deferred and the report says NOT hardened.
          # First run on a new server, before deploy exists (autosec_server:
          # new creates it): add -e ansible_user=root (-u root does NOT
          # override this line).
          ansible_user: deploy
          # Keep the private key in WSL ~/.ssh, not under /mnt/c (ssh
          # refuses keys with the loose permissions /mnt/c gives them).
          ansible_ssh_private_key_file: ~/.ssh/clients/example-client
