---
# Install with: ansible-galaxy collection install -r requirements.yml
#
# Version ranges are pinned for portability. Distro-packaged Ansible is
# often a few releases behind (e.g. Ubuntu 24.04 ships ansible-core
# 2.16), while the *latest* collections require a newer core and fail to
# load. These ranges are known to work with ansible-core >= 2.15, which
# covers current Debian/Ubuntu/RHEL. If you run a newer ansible-core you
# can safely raise the ceilings.
collections:
  - name: community.general
    version: ">=8.0.0,<10.0.0"
  - name: ansible.posix
    version: ">=1.5.0,<2.0.0"
  - name: community.postgresql
    version: ">=3.0.0,<4.0.0"
  - name: community.mysql
    version: ">=3.5.0,<4.0.0"
