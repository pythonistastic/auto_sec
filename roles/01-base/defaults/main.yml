---
# Role 01 (base) defaults.
#
# The first block holds the user-facing settings. They are documented in
# group_vars/all.yml, which site.yml reads and which beats these defaults.
# The same values stay here so that the role behaves the same in a
# playbook without group_vars (the tests in tests/base). CI checks that
# both files hold the same values.

# Hostname. keep = leave it as the server has it (default). Any other value
# must be a lowercase hostname or FQDN, at most 64 characters. Nothing in
# auto_sec uses the system hostname; inventory_hostname names the host in
# reports, alerts and backups.
server_hostname: keep

# Timezone. keep = leave it as the server has it (default). Otherwise an
# IANA name the server knows (timedatectl list-timezones), e.g. "UTC" or
# "Europe/Berlin". Changing it moves every cron job and timer that runs at
# a wall-clock time; the preflight lists them first.
timezone: keep

# The admin account deploy_user (role 01).
#   keep:   auto_sec creates no account and writes no sudo rule.
#   create: create deploy_user if it does not exist (home, shell /bin/bash,
#           password locked: key login only, no extra groups), and give it
#           passwordless sudo in auto_sec's own /etc/sudoers.d/<deploy_user>.
#           The run stops if that file is yours, or if your sudo rules
#           already name the account or one of its groups.
# An existing account is never changed (shell, groups, home, password).
# Default: create with autosec_server: new when deploy_user is also
# ssh_admin_user (and not root), else keep.
deploy_user_account: "{{ 'create' if ((autosec_server | default('') | string) == 'new' and (ssh_admin_user | default(deploy_user)) == deploy_user and deploy_user != 'root') else 'keep' }}"

# Automatic security updates (unattended-upgrades).
#   auto: install unattended-upgrades if it is missing; its own setup turns
#         the updates on (the distro default). auto_sec writes no update
#         switch of its own, so the distro's switch keeps working
#         (20auto-upgrades, dpkg-reconfigure unattended-upgrades). If the
#         server has them off, or unattended-upgrades was removed, they stay
#         off and the run prints a WARNING.
#   true: turn them on and keep them on: auto_sec's own file sets both
#         switches to "1" (daily), whatever 20auto-upgrades says
#   keep: leave them as they are; unattended-upgrades is not installed
# auto_sec never turns automatic updates off ("false" is refused).
# Default: auto with autosec_server: new, keep with existing.
unattended_upgrades_enabled: "{{ 'auto' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# Automatic reboot after an update that needs one.
#   keep:  leave the server's setting alone (default; off unless you or the
#          distro turned it on)
#   true:  reboot at unattended_reboot_time (required, QUOTED: "03:30")
#   false: never reboot automatically
unattended_automatic_reboot: keep
# unattended_reboot_time: "03:30"

# Which archives unattended-upgrades installs from.
#   keep:     leave the distro's (or your) origin list alone (default)
#   security: Ubuntu release pocket (new dependencies of security fixes),
#             security and ESM pockets; Debian security archive only.
unattended_origins: keep

# true: never update the Docker packages automatically (docker-ce,
# docker-ce-cli, docker-ce-rootless-extras, docker-buildx-plugin,
# docker-compose-plugin, containerd.io, docker.io, containerd). An update
# restarts the Docker daemon and every container.
unattended_exclude_docker: false

# More packages unattended-upgrades must never update: exact Debian package
# names (no patterns), e.g. ["nginx", "postgresql-16"]. Added to the list
# of the other files; nothing is removed from it.
unattended_upgrade_blacklist: []

# One-off switch: pass with -e on one run, never in host_vars. true runs a
# full `apt-get dist-upgrade` (it can restart services and needs a reboot
# for a new kernel). Without it, auto_sec only installs missing packages
# (without their recommendations), stops if that would upgrade or remove
# an installed package, and the nightly unattended-upgrades applies
# security updates.
apt_full_upgrade: false

# One-off switch: pass with -e on one run, never in host_vars. On a server
# set up by auto_sec 0.1-0.4, whose 50unattended-upgrades is still exactly
# the file 0.1-0.4 wrote, the run stops and shows what putting the
# distro's file back changes. true keeps a copy in
# /var/lib/auto-sec/backup/ and puts the distro's file back.
apt_migrate_unattended_upgrades: false

# --- Role-internal constants. These are not settings: do not override. ---

# The one apt file role 01 owns. It sorts after the distro's 20auto-upgrades
# and 50unattended-upgrades (so its values win over theirs) and before
# 52unattended-upgrades-local, the name unattended-upgrades' README gives
# for your own overrides (so yours win over auto_sec's).
_base_apt_parts: /etc/apt/apt.conf.d
_base_uu_file: /etc/apt/apt.conf.d/51autosec-unattended-upgrades
_base_uu_header: "// Written by auto_sec (role 01)"

# 50unattended-upgrades exactly as auto_sec 0.1-0.4 wrote it (300 bytes,
# the same in every release). Only this exact file is put back to the
# distro's copy; an edited one is yours and is left alone.
_base_uu_legacy_sha256: 96a5c57fc765cd6274f5b40829485f6dbbf8afe36c68de612a8b4cd591fc3a9d
_base_uu_dist_file: /etc/apt/apt.conf.d/50unattended-upgrades
_base_uu_pristine: /usr/share/unattended-upgrades/50unattended-upgrades
_base_dpkg_md5sums: /var/lib/dpkg/info/unattended-upgrades.md5sums
_base_ucf_hashfile: /var/lib/ucf/hashfile
_base_backup_dir: /var/lib/auto-sec/backup
_base_backup_file: /var/lib/auto-sec/backup/50unattended-upgrades.auto_sec-0.4

# Scratch space for the trial run (tmpfs, root only), also used in --check.
_base_run_dir: /run/auto-sec
_base_sim_dir: /run/auto-sec/apt-sim
_base_candidate: /run/auto-sec/apt-candidate

_base_reboot_required: /var/run/reboot-required

# Your hostname and timezone choice. Not set_fact facts: set_fact in
# ansible-core < 2.19 would turn a name like "yes" into a boolean.
_base_hostname_want: "{{ server_hostname | default('keep') }}"
_base_tz_want: "{{ timezone | default('keep') }}"

# Packages role 01 installs when they are missing (through the shared
# package guard, roles/autosec-apt): unattended-upgrades unless
# unattended_upgrades_enabled is keep (or auto, and it was removed on
# purpose), and sudo when deploy_user_account: create must write a sudo
# rule on a host without sudo. Nothing else: curl moved to role 07 in 0.6;
# 0.1-0.4 also installed git, htop, ncdu, age, apt-listchanges, python3-pip
# and jq.

# The account and its sudo rule (deploy_user_account: create). sudo reads
# every file in /etc/sudoers.d whose name has no "." and does not end in
# "~"; deploy_user cannot contain a "." (site.yml), so the file is read.
_base_sudoers: /etc/sudoers
_base_sudo_dir: /etc/sudoers.d
_base_sudo_file: "{{ _base_sudo_dir }}/{{ deploy_user }}"
_base_sudo_header: "# Written by auto_sec (role 01)"
# Exactly what 0.1-0.5 wrote (30 bytes for "deploy"). Only this content, or
# the header, proves the file is auto_sec's. A file with these bytes is
# kept as it is: it already gives the same rule.
_base_sudo_legacy_sha256: "{{ (deploy_user ~ ' ALL=(ALL) NOPASSWD:ALL\n') | hash('sha256') }}"
# The candidate is rendered here (preflight, also in --check) to compare it
# with auto_sec's file from an earlier run and to let visudo check it.
_base_sudo_candidate: /run/auto-sec/sudoers-candidate
# `visudo -c` reads sudo's whole configuration (the tests point it at a
# lab tree with -f).
_base_visudo_check: [visudo, -c]
# Names auto_sec puts into a grep pattern (the account and its groups).
_base_user_re: '^[a-z_][a-z0-9_-]{0,31}$'
# A login shell from the host is shown only if it has this shape.
_base_shell_re: '^/[A-Za-z0-9/._-]{1,64}$'
# A file name from the host is shown only after this filter (sudo scan).
_base_path_bad_re: '[^A-Za-z0-9/._@:+ -]'

# Preflight B12: the account role 02 logs in as must exist, or be created
# by this run, before anything changes. _ssh_* are role 02's preflight
# facts (site.yml runs that preflight first).
_base_admin: "{{ _ssh_admin | default(ssh_admin_user | default(deploy_user)) }}"
_base_b12: "{{ (_ssh_role_runs | default(false) | bool) and (_ssh_enabled | default(false) | bool) and _base_admin != 'root' }}"
_base_admin_created: >-
  {{ (_base_role_runs | default(false) | bool) and (_base_account_mode | default('keep')) == 'create'
     and _base_admin == deploy_user }}

# Kernel settings: auto_sec 0.6 writes none. The preflight only reads
# /etc/sysctl.conf, for two notes: the lines 0.1-0.5 wrote there are yours
# now (N01-K2), and on Debian 13 systemd-sysctl no longer reads that file
# (N01-K1: 99-sysctl.conf does not lead to it).
_base_sysctl_conf: /etc/sysctl.conf
_base_sysctl_link: /etc/sysctl.d/99-sysctl.conf
_base_sysctl_legacy_lines:
  - net.ipv4.tcp_syncookies=1
  - net.ipv4.icmp_echo_ignore_broadcasts=1
  - net.ipv4.conf.all.log_martians=1
  - net.ipv4.conf.all.accept_redirects=0
  - net.ipv4.conf.all.send_redirects=0
  - net.ipv4.conf.all.accept_source_route=0
  - kernel.dmesg_restrict=1

_base_docker_packages:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
  - docker-buildx-plugin
  - docker-compose-plugin
  - containerd.io
  - docker.io
  - containerd

# unattended_origins: security. Fixed text for both distros, so no host
# value ever reaches the file. unattended-upgrades fills in the macro.
_base_uu_security_patterns:
  - "origin=Ubuntu,archive=${distro_codename}"
  - "origin=Ubuntu,archive=${distro_codename}-security"
  - "origin=UbuntuESMApps,archive=${distro_codename}-apps-security"
  - "origin=UbuntuESM,archive=${distro_codename}-infra-security"
  - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
# Allowed-Origins entries ("origin:archive") that name only archives the
# patterns above already allow. A file read after auto_sec's may add them
# without breaking "security only" (for example Ubuntu Pro's ESM origins);
# any other entry there makes the preflight refuse.
_base_uu_security_legacy_origins:
  - "${distro_id}:${distro_codename}"
  - "${distro_id}:${distro_codename}-security"
  - "${distro_id}ESMApps:${distro_codename}-apps-security"
  - "${distro_id}ESM:${distro_codename}-infra-security"

# Values apt's FindB() reads as true (apt-pkg/contrib/strutl.cc StringToBool).
_base_true_words: ["1", "yes", "true", "with", "on", "enable"]
# Words accepted for an on/off variable (YAML booleans arrive as True/False).
_base_bool_words: ["true", "false", "yes", "no", "1", "0", "on", "off"]
_base_yes_words: ["true", "yes", "1", "on"]

_base_hostname_re: '^(?=.{1,64}$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$'
_base_tz_re: '^[A-Za-z][A-Za-z0-9_+-]{0,30}(/[A-Za-z0-9_+-]{1,30}){0,2}$'
_base_time_re: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
_base_pkg_re: '^[a-z0-9][a-z0-9+.-]{1,99}$'
# A host value (name of a cron file, timer, user) is shown only if it has
# this shape.
_base_show_re: '^[A-Za-z0-9._@:-]{1,64}$'

# apt keys role 01 reads and compares: the periodic switches and everything
# under Unattended-Upgrade::.
_base_keys_re: '^(APT::Periodic::(Enable|Unattended-Upgrade|Update-Package-Lists)|Unattended-Upgrade::\S+)$'

# Parse `apt-config dump` lines (`Key "value";`) into {key: [values]}. List
# entries are under "<List>::". Callers set _base_kv_lines as a task var.
# Host output is untrusted: ${macro} becomes <macro> and any other "{" or
# "}" becomes "?", so a value can never be read as a Jinja template by
# older ansible-core (2.16 re-templates strings that a filter made "safe").
_base_kv_g: >-
  {{ _base_kv_lines | map('regex_replace', '\$\{([a-z_]+)\}', '<\1>') | map('regex_replace', '[{}]', '?')
     | select('match', '^\S+ ".*";$') | map('regex_replace', '^(\S+) "(.*)";$', '\1 \2')
     | map('split', ' ', 1) | selectattr(0, 'match', _base_keys_re) | groupby(0) }}
_base_kv: "{{ dict(_base_kv_g | map('first') | zip(_base_kv_g | map('last') | map('map', attribute=1) | map('list'))) }}"
