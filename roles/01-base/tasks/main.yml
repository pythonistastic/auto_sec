---
# roles/01-base/tasks/main.yml - role 01 apply phase (tags: base).
#
# Preflight (tasks/preflight.yml, imported by site.yml pre_tasks) already
# checked everything and set the _base_* facts. This file:
#   1. installs the missing packages (unattended-upgrades, sudo) through
#      the shared package guard (roles/autosec-apt), without
#      recommendations and with needrestart held back; it stops instead if
#      that would upgrade or remove an installed package. If it installed
#      sudo, the sudo checks of preflight B3 run now, for the first time
#   2. on a host set up by auto_sec 0.1-0.4 only, and only with
#      -e apt_migrate_unattended_upgrades=true: keeps a copy of the old
#      50unattended-upgrades and puts the distro's own file back
#   3. writes /etc/apt/apt.conf.d/51autosec-unattended-upgrades; with
#      nothing to write (the default), removes it in auto mode only (keep
#      leaves it)
#   4. proves that apt now reads what the trial run said
#   5. full upgrade, only with -e apt_full_upgrade=true (also through the
#      guard)
#   6. deploy_user_account: create only: the account if it is missing (an
#      existing one is never changed), then auto_sec's sudo file, after the
#      preflight's checks were repeated, and a test of the rule
#   7. hostname, only when server_hostname is set and differs
#   8. timezone, only when timezone is set and differs
# auto_sec never writes 20auto-upgrades, never edits 50unattended-upgrades
# (apart from the one-time restore in 2) and never touches the apt timers.
# It writes no kernel setting (0.1-0.5 wrote 7 lines into
# /etc/sysctl.conf; they stay, as yours).

- name: "Base: the preflight must have run in this play"
  ansible.builtin.assert:
    quiet: true
    that:
      - _base_uu_plan_empty is defined
      - _base_uu_sim_after is defined
      - _base_hostname_change is defined
      - _base_user_plan is defined
      - _base_sudo_write is defined
      - _base_sudo_pf is defined
      # Preflight skips its role-01-only checks unless the tags select
      # "base"; role 01 must then not run under some other tag.
      - _base_role_runs | default(false) | bool
    fail_msg: >-
      Role 01 needs its preflight, and the role must be tagged "base". site.yml runs the
      preflight in pre_tasks (import_role name=01-base tasks_from=preflight, tags always)
      and tags role 01 "base". Do the same in any other playbook that uses role 01.
      Nothing has been changed.

# --- 1. Packages ----------------------------------------------------------------

# Only when something is missing (preflight B5b): a host that has every
# package gets no apt run at all, not even a list refresh. The guard
# refreshes the lists, checks again (install only, upgrade nothing), installs
# and proves that nothing else changed. Not in --check.
- name: "Base 1: install the missing packages"
  when: _base_pkgs_missing | length > 0
  ansible.builtin.include_role:
    name: autosec-apt
    tasks_from: install
    apply:
      tags: [base]
  vars:
    _aptg_want: "{{ _base_pkg_want }}"
    _aptg_who: "role 01 (base)"
    _aptg_allow_changes: "{{ _base_full_upgrade }}"

# sudo was not installed at preflight, so its configuration could not be
# read then. Read and check it now, before anything else changes.
- name: "Base 1: sudo's configuration, now that sudo is installed"
  when:
    - _base_sudo_write | bool
    - not (_base_sudo_installed | bool)
    - not ansible_check_mode
  block:
    - name: "Base 1: read it"
      ansible.builtin.import_tasks: sudo.yml
      vars:
        _base_sudo_scan: true

    - name: "Base 1: the sudo file did not change, and the preflight's sudo checks"
      ansible.builtin.import_tasks: sudo_check.yml
      vars:
        _base_sudo_cmp: true
        _base_sudo_end: >-
          Nothing in sudo has been changed (this run installed {{ _base_pkgs_missing | join(', ') }}).

    - name: "Base 1: these reads are what step 6b compares with"
      ansible.builtin.set_fact:
        _base_sudo_pf: "{{ _base_sudo_now }}"
        _base_sudo_installed: true

# --- 2. Host set up by auto_sec 0.1-0.4 ------------------------------------------

- name: "Base 2: put the distro's 50unattended-upgrades back"
  when: _base_uu_restore | bool
  block:
    - name: "Base 2: 50unattended-upgrades is still the file auto_sec 0.1-0.4 wrote"
      ansible.builtin.stat:
        path: "{{ _base_uu_dist_file }}"
        follow: false
        checksum_algorithm: sha256
      register: _base_m_dist

    - name: "Base 2: stop if it changed since the preflight"
      ansible.builtin.assert:
        quiet: true
        that:
          - _base_m_dist.stat.isreg | default(false)
          - _base_m_dist.stat.checksum == _base_uu_legacy_sha256
        fail_msg: >-
          {{ _base_uu_dist_file }} on {{ inventory_hostname }} changed during this run, so
          auto_sec leaves it alone. Nothing in apt.conf.d has been changed. Run again.

    - name: "Base 2: backup folder, root only"
      ansible.builtin.file:
        path: "{{ _base_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "Base 2: keep a copy of the old file"
      ansible.builtin.copy:
        src: "{{ _base_uu_dist_file }}"
        dest: "{{ _base_backup_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: "Base 2: the copy is complete"
      when: not ansible_check_mode
      ansible.builtin.stat:
        path: "{{ _base_backup_file }}"
        checksum_algorithm: sha256
      register: _base_m_backup

    - name: "Base 2: stop unless the copy is complete"
      when: not ansible_check_mode
      ansible.builtin.assert:
        quiet: true
        that: (_base_m_backup.stat.checksum | default('')) == _base_uu_legacy_sha256
        fail_msg: >-
          The copy {{ _base_backup_file }} on {{ inventory_hostname }} does not match the old
          file, so auto_sec does not replace {{ _base_uu_dist_file }}. Nothing in apt.conf.d
          has been changed.

    # ucf then sees the file it installed, and later package updates replace
    # it normally (no "modified configuration file" prompt).
    - name: "Base 2: put the distro's own file in place"
      ansible.builtin.copy:
        src: "{{ _base_uu_pristine }}"
        dest: "{{ _base_uu_dist_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        validate: apt-config -c %s dump

# --- 3. auto_sec's own apt file ---------------------------------------------------

- name: "Base 3: write 51autosec-unattended-upgrades"
  when: not (_base_uu_plan_empty | bool)
  ansible.builtin.template:
    src: 51autosec-unattended-upgrades.j2
    dest: "{{ _base_uu_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

# Preflight B3 refused any other file under this name. Only in auto mode
# (the trial run's _base_uu_file_change): with keep the file stays, as
# it may hold the update switches of an earlier run.
- name: "Base 3: nothing to write: remove auto_sec's own file (auto mode)"
  when:
    - _base_uu_plan_empty | bool
    - _base_uu_file_state == 'ours'
    - _base_uu_file_change == 'remove'
  ansible.builtin.file:
    path: "{{ _base_uu_file }}"
    state: absent

# --- 4. Prove -----------------------------------------------------------------------

- name: "Base 4: prove what apt reads now"
  when: not ansible_check_mode
  ansible.builtin.import_tasks: prove.yml

# auto mode on a host without unattended-upgrades: the package's own setup
# decided (debconf, default true). Say what it did.
- name: "Base 4: automatic updates after this run installed unattended-upgrades"
  when:
    - not ansible_check_mode
    - _base_uu_enabled_mode == 'auto'
    - _base_uu_install | bool
    - not (_base_uu_installed | bool)
  ansible.builtin.debug:
    msg: >-
      {% if _base_m_on | bool %}unattended-upgrades was installed on {{ inventory_hostname }} by this run, and
      its own setup turned automatic updates on.{% else %}WARNING: unattended-upgrades was installed on
      {{ inventory_hostname }} by this run, but its setup left automatic updates OFF (debconf
      unattended-upgrades/enable_auto_updates is false, or a file turns them off). auto_sec leaves them
      off because unattended_upgrades_enabled is auto. Set unattended_upgrades_enabled: true to turn them
      on.{% endif %}
  vars:
    _base_m_on: >-
      {{ (_base_uu_after['APT::Periodic::Unattended-Upgrade'] | default(['']) | last) not in ['0', '']
         and (_base_uu_after['APT::Periodic::Update-Package-Lists'] | default(['']) | last) not in ['0', '']
         and (_base_uu_after['APT::Periodic::Enable'] | default(['1']) | last) != '0' }}

# --- 5. Full upgrade (one-off switch) -----------------------------------------------

# Last of the apt steps, so the package's ucf sees the restored, unmodified
# 50unattended-upgrades and replaces it normally. `apt-get dist-upgrade`
# with the guard's environment (needrestart held back); not in --check.
- name: "Base 5: full upgrade (apt_full_upgrade)"
  when: _base_full_upgrade | bool
  ansible.builtin.include_role:
    name: autosec-apt
    tasks_from: upgrade
    apply:
      tags: [base]

# --- 6. The account and its sudo rule (deploy_user_account: create) ---------------

# 6a. Only a missing account is created. The user module would change the
# shell of an existing one, so the account is looked up again first.
- name: "Base 6a: the account"
  when: _base_user_plan == 'create'
  block:
    - name: "Base 6a: does the account exist now?"
      ansible.builtin.command:
        argv: [getent, passwd, "{{ deploy_user }}"]
      register: _base_m_user
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Base 6a: it was created in the meantime"
      when: _base_m_user.rc == 0
      ansible.builtin.debug:
        msg: >-
          [N01-A1] INFO: {{ deploy_user }} exists on {{ inventory_hostname }} (created since the
          preflight). auto_sec never changes an existing account.

    # No groups, no password (useradd locks it: key login only).
    - name: "Base 6a: create {{ deploy_user }}"
      when: _base_m_user.rc != 0
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true

# 6b. The same reads as the preflight, right before the write; any
# difference stops the run (M01-A1, sudo_check.yml), and the preflight's
# refusals apply again. The file is written with visudo's check, then
# proven: the account must now get passwordless sudo (M01-A2).
- name: "Base 6b: auto_sec's sudo file"
  when: _base_sudo_write | bool
  block:
    - name: "Base 6b: read sudo's files again"
      ansible.builtin.import_tasks: sudo.yml
      vars:
        _base_sudo_scan: "{{ _base_sudo_installed | bool }}"

    # Groups are read only for an account that exists: a new account's
    # groups are checked here for the first time.
    - name: "Base 6b: nothing changed since the preflight, and its checks again"
      ansible.builtin.import_tasks: sudo_check.yml
      vars:
        _base_sudo_cmp: true
        _base_sudo_end: >-
          Nothing in sudo has been changed{{ (' (this run created ' ~ deploy_user ~ ')')
          if _base_user_plan == 'create' else '' }}.

    - name: "Base 6b: write {{ _base_sudo_file }}"
      ansible.builtin.template:
        src: sudoers-autosec.j2
        dest: "{{ _base_sudo_file }}"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: "Base 6b: the account has passwordless sudo now"
      when: not ansible_check_mode
      ansible.builtin.command:
        argv: [runuser, -u, "{{ deploy_user }}", --, sudo, -n, "true"]
      register: _base_m_sudo
      changed_when: false
      failed_when: false

    - name: "Base 6b: the rule works (M01-A2)"
      when: not ansible_check_mode
      ansible.builtin.assert:
        quiet: true
        that: _base_m_sudo.rc == 0
        fail_msg: >-
          [M01-A2] auto_sec wrote {{ _base_sudo_file }} on {{ inventory_hostname }}, but "sudo -n true" as
          {{ deploy_user }} still fails ({{ (_base_m_sudo.stderr_lines | default([]) | first | default('exit ' ~ _base_m_sudo.rc))
          | regex_replace('[^ -~]', '?') | regex_replace('[{}]', '?') | truncate(200) }}). A rule read later
          probably overrides it. The file stays. Check "sudo -l -U {{ deploy_user }}".

# --- 7, 8. Hostname and timezone (only when you set them) ---------------------------

# server_hostname: keep (the default) never reaches this task. hostnamectl
# sets the static and transient name; /etc/hosts is not touched.
- name: "Base 7: hostname"
  when: _base_hostname_change | bool
  ansible.builtin.hostname:
    name: "{{ _base_hostname_want }}"

- name: "Base 8: timezone"
  when: _base_tz_change | bool
  community.general.timezone:
    name: "{{ _base_tz_want }}"

- name: "Base 8: timezone after the change"
  when:
    - _base_tz_change | bool
    - not ansible_check_mode
  ansible.builtin.command:
    argv: [timedatectl, show, -p, Timezone, --value]
  register: _base_m_tz
  changed_when: false
  failed_when: false

- name: "Base 8: remember the timezone"
  when:
    - _base_tz_change | bool
    - not ansible_check_mode
  ansible.builtin.set_fact:
    _base_tz_after: "{{ _base_m_tz.stdout | default('') | trim if (_base_m_tz.stdout | default('') | trim) is match(_base_tz_re) else '' }}"
