---
# Role 03 (firewall and fail2ban) defaults.
#
# The public settings below are documented in group_vars/all.yml, which
# site.yml reads and which beats these defaults. The same values stay here
# so that the role behaves the same in a playbook without group_vars (the
# tests in tests/fail2ban and tests/ufw). CI checks that both files hold
# the same values. The "existing"/"new" defaults follow autosec_server.

# --- ufw: public settings -------------------------------------------------
# auto_sec runs no ufw command on a ufw that is already on: it adds,
# changes, reorders and restarts nothing there. It turns ufw on only when
# ufw is off and firewall_state is enabled, after its checks, with an
# automatic undo, and keeps it on only if a brand-new SSH login works.
#   keep:    leave ufw as it is, on or off (default with autosec_server: existing)
#   enabled: turn an inactive ufw on; installs ufw if it is missing
#            (default with autosec_server: new)
firewall_state: "{{ 'enabled' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# The SSH rule added when this run turns ufw on and no rule of yours lets
# ssh_port in from every address: limit (rate-limited), allow, or keep
# (add none: then a rule of yours must let SSH in).
firewall_ssh_rule: limit

# Ports to let in when this run turns ufw on (at most 64 items):
#   - { port: 443 }                          # tcp from anywhere (allow)
#   - { port: 51820, proto: udp }
#   - { port: "6000:6010", proto: tcp }       # a range needs proto
#   - { port: 5432, from: "203.0.113.0/24" }  # one address or network
#   - { port: 25, rule: limit }               # allow (default) or limit
# On a ufw that is already on, nothing is added: the run prints the
# `sudo ufw ...` line for each item it does not find.
firewall_inbound: []

# Ports that listen now and may close when this run turns ufw on, e.g.
# ["3000/tcp"]. A listening port that is neither here nor let in stops
# the turn-on.
firewall_closed_ok: []

# Seconds the automatic undo waits for the brand-new SSH login after ufw
# is turned on (120-3600).
firewall_revert_seconds: 300

# Outgoing traffic.
#   false: leave the outgoing policy as it is (0.1-0.5 set it to allow).
#   true:  when this run turns ufw on, allow out only DNS, NTP, HTTP and
#          HTTPS (plus egress_allow_extra) and deny the rest. On a ufw that
#          is already on, auto_sec changes nothing and prints the commands.
egress_lockdown: false
# Extra outbound ports for egress_lockdown, e.g.
#   - { port: 587, proto: tcp }   # SMTP submission
egress_allow_extra: []

# --- fail2ban: public settings --------------------------------------------
# auto_sec writes only /etc/fail2ban/jail.d/00-autosec.conf, never
# jail.local. fail2ban reads it first, so any value YOUR files set wins.
#   keep: leave fail2ban alone: no install, no file, no reload (default
#         with autosec_server: existing). "false" means the same.
#   true: install fail2ban if missing, write 00-autosec.conf, reload only
#         on an effective change (default with autosec_server: new).
fail2ban_hardening_enabled: "{{ 'true' if (autosec_server | default('') | string) == 'new' else 'keep' }}"

# fail2ban [DEFAULT] values. They apply to every jail that sets none of its
# own; if one would change a jail of yours, the run stops and names it.
# Setting this replaces the whole mapping. {} = auto_sec sets none.
# Allowed keys: bantime findtime maxretry bantime.increment bantime.factor
# bantime.maxtime bantime.rndtime backend
fail2ban_defaults:
  bantime: "1h"
  bantime.increment: true
  bantime.factor: 2
  findtime: "10m"
  maxretry: 4

# One-off switch: pass with -e on one run, never in host_vars. Moves a
# jail.local written by auto_sec 0.1-0.4 to /var/lib/auto-sec/fail2ban/.
fail2ban_migrate_jail_local: false

# Role 05 only (used when app_type is set): adds the nginx-http-auth and
# nginx-botsearch jails in jail.d/00-autosec-nginx.conf after nginx is in.
fail2ban_nginx_jails: true

# --- Role-internal constants. These are not settings: do not override. ---

# The files auto_sec owns. "00-autosec" sorts right after jail.conf and
# before every other jail.d file and jail.local, so the operator's values
# win (fail2ban keeps the LAST value it reads; a jail section beats
# [DEFAULT] whatever the file order). _f2b_conf_dir is /etc/fail2ban.
_f2b_dropin: "{{ _f2b_conf_dir }}/jail.d/00-autosec.conf"
_f2b_nginx_dropin: "{{ _f2b_conf_dir }}/jail.d/00-autosec-nginx.conf"
_f2b_jail_local: "{{ _f2b_conf_dir }}/jail.local"
_f2b_marker: "# Written by auto_sec (role 03). Do not edit: the next run replaces this file."
_f2b_nginx_marker: "# Written by auto_sec (role 05). Do not edit: the next run replaces this file."

# Scratch space for the trial run (tmpfs, root only, removed every run).
_f2b_run_dir: /run/auto-sec
_f2b_sim_dir: /run/auto-sec/f2b-sim
# Copy of 00-autosec.conf before this run's write, for the rollback.
_f2b_prev_dir: /run/auto-sec/f2b-prev
# Migration backup of an auto_sec 0.1-0.4 jail.local (kept).
_f2b_backup_dir: /var/lib/auto-sec/fail2ban

# fail2ban_defaults: allowed keys and the whole-value pattern each accepts
# (anchors are added by preflight P1). bantime.formula (evaluated as code),
# ignorecommand, action, banaction and ignoreip are not allowed: addresses
# come only from office_static_ip and fail2ban_ignore_ips. -1 (ban
# forever) is not accepted. bantime.increment must be a YAML boolean.
_f2b_time_pat: '[1-9][0-9]{0,5}(s|m|h|d|w|mo|y)?'
_f2b_key_pat:
  bantime: "{{ _f2b_time_pat }}"
  findtime: "{{ _f2b_time_pat }}"
  bantime.maxtime: "{{ _f2b_time_pat }}"
  bantime.rndtime: "{{ _f2b_time_pat }}"
  maxretry: '[1-9][0-9]?'
  bantime.factor: '[0-9]{1,3}(\.[0-9]{1,3})?'
  bantime.increment: '(True|False)'
  backend: '(auto|systemd|polling|pyinotify)'

# IPv4/IPv6 address or network. Same pattern as role 02's preflight and
# site.yml (fail2ban_ignore_ips); keep them equal.
_f2b_cidr_re: >-
  ^(((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(/(3[0-2]|[12]?[0-9]))?|(?=[0-9A-Fa-f:]*:)[0-9A-Fa-f:]{2,39}(/(12[0-8]|1[01][0-9]|[1-9]?[0-9]))?)$

_f2b_bool_words: ["true", "false", "yes", "no", "1", "0", "on", "off"]

# What the template uses (after preflight P1 has checked the inputs).
_f2b_defaults: "{{ fail2ban_defaults | default({}) }}"
_f2b_ignore: >-
  {{ ([office_static_ip | default('')] + (fail2ban_ignore_ips | default([])))
     | map('string') | map('trim') | select | unique | list }}

# The two files auto_sec may write, and the jails each one is for. A change
# auto_sec's file makes to any OTHER jail is a "leak" and stops the run.
_f2b_kinds:
  main:
    name: 00-autosec.conf
    dest: "{{ _f2b_dropin }}"
    template: 00-autosec.conf.j2
    marker: "{{ _f2b_marker }}"
    jails: [sshd]
  nginx:
    name: 00-autosec-nginx.conf
    dest: "{{ _f2b_nginx_dropin }}"
    template: 00-autosec-nginx.conf.j2
    marker: "{{ _f2b_nginx_marker }}"
    jails: [nginx-http-auth, nginx-botsearch]

# How role 03 runs fail2ban's tools and the trial helper (files/). Only the
# unprivileged lab (tests/fail2ban/semantics) changes these, to point at an
# unpacked fail2ban build, a lab config tree and a conffile list; never set
# them for a real host.
_f2b_conf_dir: /etc/fail2ban
_f2b_client: fail2ban-client
_f2b_python: /usr/bin/python3
_f2b_conffiles_file: ""
_f2b_file_owner: root

# --- ufw: role-internal constants -----------------------------------------

# Outbound ports egress_lockdown always lets out (DNS, NTP, HTTP, HTTPS).
_fw_egress_base:
  - { port: 53, proto: udp }
  - { port: 53, proto: tcp }
  - { port: 123, proto: udp }
  - { port: 80, proto: tcp }
  - { port: 443, proto: tcp }

# The comment every rule auto_sec adds carries, so it is provably auto_sec's.
_fw_comment: auto_sec

# ufw's four files the undo guard snapshots before ufw is turned on and puts
# back byte-for-byte on revert (the guard also runs `ufw --force disable`).
_fw_guard_paths:
  - /etc/ufw/ufw.conf
  - /etc/default/ufw
  - /etc/ufw/user.rules
  - /etc/ufw/user6.rules

# How role 03 runs ufw and the turn-on helper (files/). Only the
# unprivileged lab (tests/ufw/semantics) changes these, to point at an
# unpacked ufw build, a lab config tree and lab /proc and /sys copies;
# never set them for a real host.
_fw_ufw_argv: [ufw]
_fw_python: /usr/bin/python3
_fw_helper_lab_args: []
