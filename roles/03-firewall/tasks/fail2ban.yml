---
# roles/03-firewall/tasks/fail2ban.yml - role 03's fail2ban part (issue #2).
#
# Included by main.yml (tags: fail2ban) when fail2ban_hardening_enabled is
# true (with keep, role 03 leaves fail2ban alone). auto_sec writes one file
# of its own, /etc/fail2ban/jail.d/00-autosec.conf, and never writes
# jail.local. fail2ban reads that file right after jail.conf, so every value
# your own files set wins.
#
#   F1  install fail2ban through the package guard (autosec-apt: a dry run
#       first, nothing upgraded or removed, needrestart held back)
#   F2  --check on a host without fail2ban: say so and stop here
#   F3  trial run and decision again, after roles 01 and 02 (preflight P3
#       did the same before anything changed)
#   F4-F10 apply.yml: write, check, reload only on an effective change, verify
#   F11 start fail2ban only if this run installed it (its package enables it)
#   F12 one line for the report (_f2b_report)

- name: "fail2ban: the preflight must have run in this play"
  ansible.builtin.assert:
    quiet: true
    that:
      - _f2b_enabled is defined
      - _f2b_installed_before is defined
      - _f2b_role_runs | default(false) | bool
    fail_msg: >-
      Role 03's fail2ban part needs its preflight, and the role must be tagged
      "firewall". site.yml runs the preflight in pre_tasks (import_role
      name=03-firewall tasks_from=preflight, tags always). Do the same in any other
      playbook that uses role 03. Nothing has been changed in fail2ban.

- name: "fail2ban F1: install fail2ban (package guard)"
  when: not ansible_check_mode
  ansible.builtin.include_role:
    name: autosec-apt
    tasks_from: install
  vars:
    _aptg_want: "{{ _f2b_pkg_want }}"
    _aptg_who: role 03 (fail2ban)

- name: "fail2ban F1: is fail2ban installed now?"
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}", fail2ban]
  register: _f2b_pkg_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: "fail2ban F1: fail2ban must be installed now (outside --check)"
  ansible.builtin.assert:
    quiet: true
    that: ansible_check_mode or ((_f2b_pkg_now.stdout | default('')) is match('^.i'))
    fail_msg: >-
      apt reported fail2ban as installed, but dpkg says it is not
      ({{ _f2b_pkg_now.stdout | default('') | regex_replace('[{}]', '?') }}). fail2ban has not been configured.

- name: "fail2ban F2: check mode on a host without fail2ban"
  when: (_f2b_pkg_now.stdout | default('')) is not match('^.i')
  ansible.builtin.debug:
    msg: >-
      fail2ban is not installed on {{ inventory_hostname }} yet. The real run installs
      it, runs the same trial on its config, writes {{ _f2b_dropin }} and loads it.

- name: "fail2ban: trial, write and load"
  when: (_f2b_pkg_now.stdout | default('')) is match('^.i')
  block:
    - name: "fail2ban F3: trial run on a copy of /etc/fail2ban (after roles 01 and 02)"
      ansible.builtin.include_tasks:
        file: trial.yml
      vars:
        _f2b_kind: main
        _f2b_stage: apply

    - name: "fail2ban F3: refuse or go on"
      ansible.builtin.include_tasks:
        file: decide.yml
      vars:
        _f2b_kind: main
        _f2b_stage: apply

    - name: "fail2ban F4-F10: write, check, load and verify"
      ansible.builtin.include_tasks:
        file: apply.yml
      vars:
        _f2b_kind: main

    # F11. A fail2ban that was installed before this run keeps its state:
    # auto_sec never starts, stops or enables it (N03-F6 said so). The
    # package enables and starts the one this run installed; start it if
    # it is not running yet. No `systemctl enable`: that reloads systemd
    # like a daemon-reload.
    - name: "fail2ban F11: start the fail2ban this run installed"
      when: not (_f2b_installed_before | bool)
      ansible.builtin.systemd:
        name: fail2ban
        state: started

    - name: "fail2ban F11: is it enabled at boot?"
      when: not (_f2b_installed_before | bool)
      ansible.builtin.command:
        argv: [systemctl, is-enabled, fail2ban.service]
      register: _f2b_f11_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "fail2ban F11: not enabled at boot"
      when:
        - _f2b_f11_enabled is not skipped
        - (_f2b_f11_enabled.stdout | default('') | trim) != 'enabled'
      ansible.builtin.debug:
        msg: >-
          NOTE: fail2ban runs on {{ inventory_hostname }}, but its package did not enable it at
          boot. Enable it with: sudo systemctl enable fail2ban

    - name: "fail2ban F12: one line for the report"
      ansible.builtin.include_tasks:
        file: report.yml
