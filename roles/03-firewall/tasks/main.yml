---
# roles/03-firewall/tasks/main.yml - ufw (ufw.yml), then fail2ban (fail2ban.yml).
#
# Both parts follow what their preflight (tasks/preflight.yml, imported by
# site.yml pre_tasks) planned, and check the host again before they write.
#
# ufw: no ufw command ever runs on a ufw that is already on (#8). An
# inactive ufw is turned on only with firewall_state: enabled, under role
# 02's undo guard, and kept only if a brand-new SSH login works.
#
# fail2ban: only with fail2ban_hardening_enabled: true. Role 03 writes only
# /etc/fail2ban/jail.d/00-autosec.conf and never jail.local (issue #2).
# There is no handler: fail2ban is reloaded in fail2ban.yml, and only when
# its effective config changes.

- name: ufw (no command on an active ufw; turn-on only when planned)
  ansible.builtin.include_tasks:
    file: ufw.yml
    apply:
      tags: [ufw]
  tags: [ufw]

- name: fail2ban (jail.d/00-autosec.conf; never jail.local)
  when: _f2b_enabled | default(false) | bool
  ansible.builtin.include_tasks:
    file: fail2ban.yml
    apply:
      tags: [fail2ban]
  tags: [fail2ban]
