---
# roles/03-firewall/tasks/preflight.yml
#
# Role 03's read-only preflight. site.yml imports this file in pre_tasks
# with tags [always], after the SSH and base preflights, so a refusal comes
# BEFORE any role changes anything. It also runs in --check.
#
#   vars.yml           U1    ufw variable checks (no host access)
#   ufw-preflight.yml  U2-U3 ufw: no command on an active ufw; the turn-on
#                            checks when ufw is off and firewall_state is enabled
#   below              PF1-PF4 fail2ban, only with fail2ban_hardening_enabled: true
#                      and, with fail2ban_slow_scanners: true, the slow-scanner
#                      files (slow-trial.yml, slow-decide.yml)
#   end                _plan_03 (the run plan's role 03 lines)
#
# It writes only scratch copies under /run/auto-sec (tmpfs, root only,
# removed again at the end of each trial).
#
# Trust boundary (SECURITY.md): what is read from the host is shown to you,
# used to refuse, or used to decide whether role 03 reloads fail2ban,
# restarts its sshd jail, and (only with -e fail2ban_migrate_jail_local=true)
# moves a jail.local that auto_sec 0.1-0.4 wrote. It never becomes part of a
# config file or a ufw rule: 00-autosec.conf and the ufw rules are built
# from your variables only. With fail2ban_slow_scanners: true, two things
# read from the host decide what is written, each one checked first: a yes
# or no (is the recidive section in 00-autosec-slow.conf?) and one number
# (the seconds of dbpurgeage in fail2ban.d/00-autosec.conf).
#
# fail2ban facts set on every host:
#   _f2b_enabled             bool  fail2ban_hardening_enabled is true ("keep" and "false": no)
#   _f2b_role_runs           bool  the tags select role 03's fail2ban part
#   _f2b_migrate             bool  fail2ban_migrate_jail_local
#   _f2b_installed_before    bool  fail2ban was installed when the run started
#   _f2b_active_before       bool  fail2ban.service was active
#   _f2b_unit_enabled_before bool  fail2ban.service was enabled
#   _f2b_trial               dict  output of the last trial (files/auto-sec-f2b-check)
#   _f2b_file_differs        bool  00-autosec.conf would get new content
#   _f2b_pkg_want            list  packages the fail2ban part wants (autosec-apt)
#   _f2b_plan                str   what role 03 does with fail2ban
#   _f2b_report              str   one line for the report (role 10)
#   _f2b_slow                bool  fail2ban_slow_scanners is true
#   _f2b_slow_trial          dict  output of the last slow-scanner trial
#   _f2b_slow_rec_in         bool  the recidive section is written (the trial says)
#   _f2b_slow_db_s           int   dbpurgeage as written, in seconds (the trial says)
#   _f2b_slow_plan           str   what role 03 does for slow scanners
# and _plan_03: list of {role, part, do, what, note}; [] = no change.
#
# Checks that protect only role 03's own write (PF3) run only when the tags
# select it ("firewall" or "fail2ban"), so that for example --tags backups
# is not refused because of a fail2ban change that would not happen.

- name: "ufw U1: variable checks"
  ansible.builtin.import_tasks: vars.yml

- name: "ufw U2-U3: reads, notes and turn-on checks"
  ansible.builtin.import_tasks: ufw-preflight.yml

- name: "fail2ban preflight: start every fail2ban fact from a safe value"
  ansible.builtin.set_fact:
    _f2b_enabled: "{{ (fail2ban_hardening_enabled | default('keep') | string | lower) in ['true', 'yes', '1', 'on'] }}"
    _f2b_migrate: "{{ (fail2ban_migrate_jail_local | default(false) | string | lower) in ['true', 'yes', '1', 'on'] }}"
    _f2b_role_runs: >-
      {{ (('all' in ansible_run_tags) or ('tagged' in ansible_run_tags)
          or ('firewall' in ansible_run_tags) or ('fail2ban' in ansible_run_tags))
         and ('firewall' not in ansible_skip_tags) and ('fail2ban' not in ansible_skip_tags)
         and ('tagged' not in ansible_skip_tags) and ('all' not in ansible_skip_tags) }}
    _f2b_installed_before: false
    _f2b_version_before: ""
    _f2b_active_before: false
    _f2b_unit_enabled_before: false
    _f2b_trial: {}
    _f2b_file_differs: false
    _f2b_will_migrate: false
    _f2b_will_reload: false
    _f2b_will_restart_sshd: false
    _f2b_pkg_want: []
    _plan_03_f2b: []
    _f2b_slow: "{{ (fail2ban_slow_scanners | default(false) | string | lower) in ['true', 'yes', '1', 'on'] }}"
    _f2b_slow_trial: {}
    _f2b_slow_rec_in: false
    _f2b_slow_db_s: 0
    _f2b_slow_jail_differs: false
    _f2b_slow_db_differs: false
    _f2b_slow_will_reload: false
    _f2b_slow_will_set: false
    _f2b_slow_plan: ""
    _f2b_slow_jail_note: ""
    _f2b_slow_db_note: ""
    _f2b_slow_change_lines: []
    _f2b_slow_rec_gone: false
    _f2b_slow_note_ids: []
    _f2b_slow_noted: []
    _plan_03_slow: []
    _f2b_plan: >-
      {{ 'keep (no install, no file, no reload)'
         if (fail2ban_hardening_enabled | default('keep') | string | lower) not in ['true', 'yes', '1', 'on']
         else 'not checked (fail2ban is not selected by --tags)' }}
    _f2b_report: >-
      {{ 'fail2ban is not managed by auto_sec (fail2ban_hardening_enabled: keep)'
         if (fail2ban_hardening_enabled | default('keep') | string | lower) not in ['true', 'yes', '1', 'on']
         else 'fail2ban was not checked in this run' }}

# --- PF1. Variable checks (no host access) ---------------------------------

- name: "fail2ban preflight PF1: on/off switches are true or false (or keep)"
  ansible.builtin.assert:
    quiet: true
    that:
      - (fail2ban_hardening_enabled | default('keep') | string | lower) in _f2b_bool_words + ['keep']
      - (fail2ban_migrate_jail_local | default(false) | string | lower) in _f2b_bool_words
      - (fail2ban_nginx_jails | default(true) | string | lower) in _f2b_bool_words
    fail_msg: >-
      fail2ban_hardening_enabled ({{ fail2ban_hardening_enabled | default('keep') }}) must be keep
      or true (false means keep), and fail2ban_migrate_jail_local
      ({{ fail2ban_migrate_jail_local | default(false) }}) and fail2ban_nginx_jails
      ({{ fail2ban_nginx_jails | default(true) }}) true or false. Nothing has been changed.

- name: "fail2ban preflight PF1: the slow-scanner switches are true or false"
  ansible.builtin.assert:
    quiet: true
    that:
      - (fail2ban_slow_scanners | default(false) | string | lower) in _f2b_bool_words
      - (fail2ban_slow_recidive_enabled | default(true) | string | lower) in _f2b_bool_words
    fail_msg: >-
      fail2ban_slow_scanners ({{ fail2ban_slow_scanners | default(false) | string | truncate(30) }}) and
      fail2ban_slow_recidive_enabled ({{ fail2ban_slow_recidive_enabled | default(true) | string | truncate(30) }})
      must be true or false. Nothing has been changed.

# The values reach jail.d/00-autosec-slow.conf (an INI file), so each one
# has a strict shape, and all three keys are required: a jail without its
# own findtime would take the short one from [DEFAULT].
- name: "fail2ban preflight PF1: fail2ban_slow_sshd, fail2ban_slow_recidive and fail2ban_slow_dbpurgeage"
  when: _f2b_slow | bool
  ansible.builtin.assert:
    quiet: true
    that:
      - _f2b_sl_bad | length == 0
      - _f2b_sl_db is match('^' ~ _f2b_time_pat ~ '$')
      - _f2b_sl_db is not search('[\r\n]')
    fail_msg: >-
      {% if _f2b_sl_bad | length > 0 %}{{ _f2b_sl_bad | join('; ') }}. fail2ban_slow_sshd and
      fail2ban_slow_recidive must each be a mapping with exactly findtime, maxretry and bantime,
      for example {findtime: "1d", maxretry: 6, bantime: "1w"}. Times look like 10m, 1h, 1d, 4w;
      maxretry is 1 to 99; bantime may also be -1 (banned until you unban).
      {% else %}fail2ban_slow_dbpurgeage ({{ _f2b_sl_db | truncate(30) }}) must be a time like 30d or 8w.
      {% endif %}Nothing has been changed.
  vars:
    _f2b_sl_db: "{{ fail2ban_slow_dbpurgeage | default('30d') | string }}"
    _f2b_sl_bad: >-
      {%- set bad = [] -%}
      {%- for name, m in [['fail2ban_slow_sshd', fail2ban_slow_sshd | default({})],
                          ['fail2ban_slow_recidive', fail2ban_slow_recidive | default({})]] -%}
      {%- if m is not mapping -%}
      {%- set _ = bad.append(name ~ ' is not a mapping') -%}
      {%- elif (m | dict2items | map(attribute='key') | map('string') | sort | list) != (_f2b_slow_key_pat | dict2items | map(attribute='key') | sort | list) -%}
      {%- set _ = bad.append(name ~ ' has the keys ' ~ (m | dict2items | map(attribute='key') | map('string') | sort | join(', ') | regex_replace('[{}]', '?') | truncate(80))) -%}
      {%- else -%}
      {%- for k, pat in _f2b_slow_key_pat | dictsort -%}
      {%- if (m[k] | string) is not match('^' ~ pat ~ '$') or (m[k] | string) is search('[\r\n]') -%}
      {%- set _ = bad.append(name ~ '.' ~ k ~ ' is ' ~ (m[k] | string | regex_replace('[{}]', '?') | truncate(30))) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ bad }}

- name: "fail2ban preflight PF1: fail2ban_defaults uses allowed keys and values"
  when: _f2b_enabled | bool
  ansible.builtin.assert:
    quiet: true
    that:
      - _f2b_d is mapping
      - _f2b_pairs | reject('match', _f2b_pair_re) | list | length == 0
      - _f2b_pairs | select('search', '[\r\n]') | list | length == 0
      - ('bantime.increment' not in _f2b_d) or (_f2b_d['bantime.increment'] is boolean)
      - ('bantime.factor' not in _f2b_d) or ((_f2b_d['bantime.factor'] | float) > 0)
    fail_msg: >-
      {% if _f2b_d is not mapping %}fail2ban_defaults must be a mapping, for example
      {bantime: "1h", maxretry: 4}, or {} for none. Got: {{ _f2b_d | string | truncate(80) }}.
      {% else %}fail2ban_defaults has entries auto_sec does not accept:
      {{ (_f2b_pairs | reject('match', _f2b_pair_re) | list) + (_f2b_pairs | select('search', '[\r\n]') | list) }}.
      Allowed keys and values: {{ _f2b_key_pat }} (times like 10m, 1h, 4w; -1 is
      not accepted). bantime.increment must be true or false without quotes.
      {% if 'ignoreip' in _f2b_d %}Addresses fail2ban must ignore go in office_static_ip and
      fail2ban_ignore_ips, not here. {% endif %}bantime.formula, ignorecommand, action and banaction
      are never written by auto_sec: set them in your own jail.local.
      {% endif %}Nothing has been changed.
  vars:
    _f2b_d: "{{ fail2ban_defaults | default({}) }}"
    _f2b_pairs: >-
      {{ (_f2b_d | dict2items | map(attribute='key') | map('string')
          | zip(_f2b_d | dict2items | map(attribute='value') | map('string')) | map('join', '=') | list)
         if _f2b_d is mapping else [] }}
    _f2b_pair_re: >-
      ^({{ _f2b_key_pat | dict2items | map(attribute='key') | map('regex_escape')
           | zip(_f2b_key_pat | dict2items | map(attribute='value')) | map('join', '=') | join('|') }})$

- name: "fail2ban preflight PF1: addresses fail2ban must ignore are IP addresses or networks"
  when: (_f2b_enabled | bool) or (_f2b_slow | bool)
  ansible.builtin.assert:
    quiet: true
    that:
      - _f2b_ips is sequence
      - _f2b_ips is not string
      - _f2b_ips is not mapping
      - _f2b_ips | map('string') | reject('match', _f2b_cidr_re) | list | length == 0
      - _f2b_office | length == 0 or _f2b_office is match(_f2b_cidr_re)
    fail_msg: >-
      office_static_ip ("{{ _f2b_office }}") and every entry of fail2ban_ignore_ips
      ({{ _f2b_ips }}) must be an IPv4/IPv6 address or network, for example
      "203.0.113.7" or "198.51.100.0/24". auto_sec writes them into fail2ban's
      ignoreip. Nothing has been changed.
  vars:
    _f2b_ips: "{{ fail2ban_ignore_ips | default([]) }}"
    _f2b_office: "{{ office_static_ip | default('') | string | trim }}"

# --- PF2. Is fail2ban installed and running? (read-only) -------------------

- name: "fail2ban preflight PF2: installed fail2ban package"
  when: (_f2b_enabled | bool) or (_f2b_slow | bool)
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev} ${Version}", fail2ban]
  register: _f2b_pf_pkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: "fail2ban preflight PF2: state of fail2ban.service"
  when: (_f2b_enabled | bool) or (_f2b_slow | bool)
  ansible.builtin.command:
    argv: [systemctl, is-active, fail2ban.service]
  register: _f2b_pf_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: "fail2ban preflight PF2: is fail2ban.service enabled at boot?"
  when: (_f2b_enabled | bool) or (_f2b_slow | bool)
  ansible.builtin.command:
    argv: [systemctl, is-enabled, fail2ban.service]
  register: _f2b_pf_unit
  changed_when: false
  failed_when: false
  check_mode: false

- name: "fail2ban preflight PF2: remember the state before this run"
  when: (_f2b_enabled | bool) or (_f2b_slow | bool)
  ansible.builtin.set_fact:
    _f2b_installed_before: "{{ (_f2b_pf_pkg.rc | default(1)) == 0 and (_f2b_pf_pkg.stdout | default('')) is match('^.i') }}"
    _f2b_version_before: "{{ (_f2b_pf_pkg.stdout | default('')).split()[1:2] | join('') | regex_replace('[^A-Za-z0-9.:+~-]', '?') }}"
    _f2b_active_before: "{{ (_f2b_pf_active.stdout | default('') | trim) == 'active' }}"
    _f2b_unit_enabled_before: "{{ (_f2b_pf_unit.stdout | default('') | trim) == 'enabled' }}"

# --- PF3. Trial run on a copy (only when role 03's fail2ban part runs) -----

- name: "fail2ban preflight PF3: the migration switch needs an installed fail2ban"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
    - _f2b_migrate | bool
  ansible.builtin.assert:
    quiet: true
    that: _f2b_installed_before | bool
    fail_msg: >-
      fail2ban_migrate_jail_local is set, but fail2ban is not installed on
      {{ inventory_hostname }}: there is nothing to migrate. Run again without
      -e fail2ban_migrate_jail_local=true. Nothing has been changed.

- name: "fail2ban preflight PF3: trial run and decision"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
    - _f2b_installed_before | bool
  block:
    - name: "fail2ban preflight PF3: trial run on a copy of /etc/fail2ban"
      ansible.builtin.include_tasks:
        file: trial.yml
      vars:
        _f2b_kind: main
        _f2b_stage: preflight

    - name: "fail2ban preflight PF3: refuse or go on"
      ansible.builtin.include_tasks:
        file: decide.yml
      vars:
        _f2b_kind: main
        _f2b_stage: preflight

# keep: no install, no file, no reload, no trial. One read: auto_sec never
# deletes its own file, so say when an earlier run's file still applies.
- name: "fail2ban preflight PF3: is an earlier 00-autosec.conf still in place?"
  when:
    - not (_f2b_enabled | bool)
    - _f2b_role_runs | bool
  ansible.builtin.stat:
    path: "{{ _f2b_dropin }}"
    get_checksum: false
  register: _f2b_pf_left

- name: "fail2ban preflight N03-F1: the file an earlier run wrote still applies"
  when:
    - _f2b_pf_left is not skipped
    - _f2b_pf_left.stat.exists | default(false)
  ansible.builtin.debug:
    msg: >-
      INFO: auto_sec's 00-autosec.conf from an earlier run stays and still applies on
      {{ inventory_hostname }} (fail2ban_hardening_enabled: keep). Set true to keep managing
      it, or delete it by hand (then `sudo fail2ban-client reload`).

# --- PF3 for fail2ban_slow_scanners -------------------------------------------
# The switch works with fail2ban_hardening_enabled: keep, but it installs
# nothing: fail2ban must be there, or the fail2ban part installs it in this
# same run (true). Then the trial runs later, in fail2ban-slow.yml.

- name: "fail2ban preflight R03-F8: the slow-scanner jails need an installed fail2ban"
  when:
    - _f2b_slow | bool
    - _f2b_role_runs | bool
  ansible.builtin.assert:
    quiet: true
    that: (_f2b_installed_before | bool) or (_f2b_enabled | bool)
    fail_msg: >-
      fail2ban_slow_scanners is true, but fail2ban is not installed on {{ inventory_hostname }},
      and this run does not install it (fail2ban_hardening_enabled:
      {{ fail2ban_hardening_enabled | default('keep') | string | truncate(20) }}). Install fail2ban yourself,
      or set fail2ban_hardening_enabled: true (auto_sec then installs it and writes its
      00-autosec.conf), or set fail2ban_slow_scanners: false. Nothing has been changed.

- name: "fail2ban preflight PF3: trial run and decision for the slow-scanner files"
  when:
    - _f2b_slow | bool
    - _f2b_role_runs | bool
    - _f2b_installed_before | bool
  block:
    - name: "fail2ban preflight PF3: trial run of the slow-scanner files on a copy of /etc/fail2ban"
      ansible.builtin.include_tasks:
        file: slow-trial.yml
      vars:
        _f2b_stage: preflight

    - name: "fail2ban preflight PF3: refuse or go on (slow-scanner files)"
      ansible.builtin.include_tasks:
        file: slow-decide.yml
      vars:
        _f2b_stage: preflight

# false: no file, no reload, no trial. One read: auto_sec never deletes its
# own files, so say when an earlier run's files still apply.
- name: "fail2ban preflight PF3: are slow-scanner files of an earlier run still in place?"
  when:
    - not (_f2b_slow | bool)
    - _f2b_role_runs | bool
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        for f in "$@"; do
          if [ -f "$f" ] && [ ! -L "$f" ]; then printf 'file %s ' "$f"; head -n 1 -- "$f"; echo; fi
        done
      - sh
      - "{{ _f2b_slow_dropin }}"
      - "{{ _f2b_slow_db_dropin }}"
  register: _f2b_pf_slow_left
  changed_when: false
  failed_when: false
  check_mode: false

- name: "fail2ban preflight N03-F8: the slow-scanner files of an earlier run still apply"
  when:
    - _f2b_pf_slow_left is not skipped
    - _f2b_sl_left | length > 0
  ansible.builtin.debug:
    msg: >-
      INFO: auto_sec's {{ _f2b_sl_left | join(' and ') }} from an earlier run
      {{ 'stays and still applies' if (_f2b_sl_left | length == 1) else 'stay and still apply' }} on
      {{ inventory_hostname }} (fail2ban_slow_scanners: false removes nothing). Set true to keep
      managing {{ 'it' if (_f2b_sl_left | length == 1) else 'them' }}. To remove by hand:
      `sudo rm {{ _f2b_sl_left | join(' ') }}`, then
      `sudo fail2ban-client -t && sudo fail2ban-client reload`. That reload stops the jails
      sshd-slow and recidive if auto_sec's file added them, lifts their bans, and puts
      fail2ban's memory (dbpurgeage) back to the value of your files.
  vars:
    _f2b_sl_left: >-
      {{ [_f2b_slow_dropin, _f2b_slow_db_dropin]
         | select('in', (_f2b_pf_slow_left.stdout_lines | default([])
                         | select('search', ' ' ~ (_f2b_marker | regex_escape) ~ '$')
                         | map('regex_replace', '^file (\S+) .*$', '\1') | list))
         | list }}

# --- PF4. Packages, plan and summary -----------------------------------------

- name: "fail2ban preflight PF4: packages the fail2ban part wants (package guard)"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
  ansible.builtin.set_fact:
    _f2b_pkg_want: "{{ ['fail2ban'] + (['python3-systemd'] if (_f2b_defaults.backend | default('')) == 'systemd' else []) }}"

# "what" holds your values and constant names only. A fresh install starts
# a service that bans by default: the plan says what it bans and who is
# exempt.
- name: "fail2ban preflight PF4: plan lines"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
  vars:
    _f2b_i: "{{ [] if (_f2b_installed_before | bool) else [{'role': '03', 'part': 'fail2ban', 'do': 'install', 'what': _f2b_pkg_want | join(' '), 'note': ''}] }}"
    # The file's settings, from the template's inputs (your values only),
    # so another value gives another plan id.
    _f2b_w_what: >-
      {{ _f2b_dropin ~ ': '
         ~ ((_f2b_defaults | dictsort | map('join', ' ') | map('lower') | join(', ')) or 'no [DEFAULT] values')
         ~ ('; ignoreip ' ~ (_f2b_ignore | join(' ')) if (_f2b_ignore | length > 0) else '')
         ~ '; sshd port ' ~ (ssh_port | int) }}
    _f2b_w: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'write', 'what': _f2b_w_what, 'note': ''}]
         if (not (_f2b_installed_before | bool) or (_f2b_file_differs | bool)) else [] }}
    _f2b_m: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'replace', 'what': 'move jail.local (auto_sec 0.1-0.4) to ' ~ _f2b_backup_dir ~ '/', 'note': ''}]
         if (_f2b_will_migrate | bool) else [] }}
    _f2b_r: >-
      {{ ([{'role': '03', 'part': 'fail2ban', 'do': 'reload', 'what': 'fail2ban', 'note': ''}] if (_f2b_will_reload | bool) else [])
         + ([{'role': '03', 'part': 'fail2ban', 'do': 'restart', 'what': 'fail2ban sshd jail', 'note': ''}] if (_f2b_will_restart_sshd | bool) else []) }}
    _f2b_s: >-
      {{ [] if (_f2b_installed_before | bool) else
         [{'role': '03', 'part': 'fail2ban', 'do': 'start',
           'what': 'fail2ban (sshd jail: bans after ' ~ (_f2b_defaults.maxretry | default(5)) ~ ' failures in '
                   ~ (_f2b_defaults.findtime | default('10m')) ~ '; exempt: '
                   ~ ((_f2b_ignore | join(', ')) if (_f2b_ignore | length > 0) else 'nobody') ~ ')',
           'note': ''}] }}
  ansible.builtin.set_fact:
    _plan_03_f2b: "{{ _f2b_i + _f2b_m + _f2b_w + _f2b_r + _f2b_s }}"
    _f2b_plan: >-
      {{ ('install and start fail2ban, write ' ~ _f2b_kinds.main.name) if not (_f2b_installed_before | bool) else _f2b_plan }}

- name: "fail2ban preflight N03-F2: nobody is exempt from bans"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
    - not (_f2b_installed_before | bool)
    - _f2b_ignore | length == 0
  ansible.builtin.debug:
    msg: >-
      NOTE: nobody is exempt from bans on {{ inventory_hostname }} (office_static_ip and
      fail2ban_ignore_ips are empty).

# The slow-scanner files. "what" holds your values and constant names only;
# what the trial read on the host (each jail as fail2ban will run it, the
# seconds of dbpurgeage and why) is in "note". On a host where this run
# installs fail2ban first there was no trial yet: both files, the runtime
# dbpurgeage and the reload are listed.
- name: "fail2ban preflight PF4: plan lines for the slow-scanner files"
  when:
    - _f2b_slow | bool
    - _f2b_role_runs | bool
  vars:
    _f2b_sl_new: "{{ not (_f2b_installed_before | bool) }}"
    _f2b_sl_rec: >-
      {{ ((fail2ban_slow_recidive_enabled | default(true) | string | lower) in ['true', 'yes', '1', 'on'])
         if (_f2b_sl_new | bool) else (_f2b_slow_rec_in | bool) }}
    _f2b_sl_ban: "{{ fail2ban_slow_sshd.bantime | string }}"
    _f2b_sl_find: "{{ fail2ban_slow_recidive.findtime | string }}"
    # Can sshd-slow alone ban an address often enough for recidive? Not
    # when its ban time, times the bans recidive still needs after the
    # first, fills recidive's window.
    _f2b_sl_reach: >-
      {{ _f2b_sl_ban != '-1'
         and ((_f2b_sl_ban | regex_replace('[a-z]+$', '') | int) * (_f2b_unit_s[_f2b_sl_ban | regex_replace('^[0-9]+', '')] | int)
              * ((fail2ban_slow_recidive.maxretry | int) - 1))
             < ((_f2b_sl_find | regex_replace('[a-z]+$', '') | int) * (_f2b_unit_s[_f2b_sl_find | regex_replace('^[0-9]+', '')] | int)) }}
    _f2b_sl_what: >-
      {{ _f2b_slow_dropin ~ ': sshd-slow bans after ' ~ fail2ban_slow_sshd.maxretry ~ ' failed logins in '
         ~ fail2ban_slow_sshd.findtime ~ ' ' ~ ('until you unban' if _f2b_sl_ban == '-1' else ('for ' ~ _f2b_sl_ban))
         ~ ' (port ' ~ (ssh_port | int) ~ ')'
         ~ (('; recidive bans after ' ~ fail2ban_slow_recidive.maxretry ~ ' bans by the other jails in ' ~ _f2b_sl_find ~ ' '
             ~ ('until you unban' if (fail2ban_slow_recidive.bantime | string) == '-1' else ('for ' ~ fail2ban_slow_recidive.bantime))
             ~ ' (all ports; '
             ~ ('sshd-slow bans count too' if (_f2b_sl_reach | bool)
                else 'sshd-slow alone cannot reach it, it bans an address at most once in that time')
             ~ ')') if (_f2b_sl_rec | bool) else '')
         ~ (('; ignoreip: sshd-slow takes the list of the sshd jail' ~ (', recidive the list in [DEFAULT]' if (_f2b_sl_rec | bool) else '')
             ~ ', plus ' ~ (_f2b_ignore | join(' ')))
            if (_f2b_ignore | length > 0) else
            ('; ignoreip: ' ~ ('both jails take' if (_f2b_sl_rec | bool) else 'sshd-slow takes')
             ~ ' the list in [DEFAULT], and no address of yours is named')) }}
    _f2b_sl_w1: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'write', 'what': _f2b_sl_what, 'note': _f2b_slow_jail_note}]
         if ((_f2b_sl_new | bool) or (_f2b_slow_jail_differs | bool)) else [] }}
    _f2b_sl_w2: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'write',
           'what': _f2b_slow_db_dropin ~ ': dbpurgeage at least ' ~ fail2ban_slow_dbpurgeage
                   ~ ' (longer when a jail bans or looks back for longer; never shorter than the server has it)',
           'note': _f2b_slow_db_note}]
         if ((_f2b_sl_new | bool) or (_f2b_slow_db_differs | bool)) else [] }}
    _f2b_sl_set: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'reload',
           'what': 'fail2ban dbpurgeage at run time (fail2ban-client set dbpurgeage; no restart)', 'note': ''}]
         if ((_f2b_sl_new | bool) or (_f2b_slow_will_set | bool)) else [] }}
    _f2b_sl_rl: >-
      {{ [{'role': '03', 'part': 'fail2ban', 'do': 'reload',
           'what': 'fail2ban, for 00-autosec-slow.conf ('
                   ~ ("auto_sec's recidive jail of an earlier run goes, its bans are lifted; the other jails and their bans stay"
                      if (_f2b_slow_rec_gone | default(false) | bool) else 'the other jails and every ban stay') ~ ')',
           'note': ''}]
         if ((_f2b_sl_new | bool) or (_f2b_slow_will_reload | bool)) else [] }}
  ansible.builtin.set_fact:
    _plan_03_slow: "{{ _f2b_sl_w1 + _f2b_sl_w2 + _f2b_sl_set + _f2b_sl_rl }}"
    _f2b_slow_plan: >-
      {{ 'write 00-autosec-slow.conf and fail2ban.d/00-autosec.conf once fail2ban is installed; set dbpurgeage, reload fail2ban'
         if (_f2b_sl_new | bool) else _f2b_slow_plan }}

- name: "Role 03: plan lines (ufw and fail2ban)"
  ansible.builtin.set_fact:
    _plan_03: "{{ (_plan_03_ufw | default([])) + (_plan_03_f2b | default([])) + (_plan_03_slow | default([])) }}"
    _f2b_plan: >-
      {{ _f2b_plan ~ (('; slow scanners: ' ~ (_f2b_slow_plan or 'not checked (fail2ban is not selected by --tags)'))
                      if (_f2b_slow | bool) else '') }}

- name: "fail2ban preflight: summary"
  when:
    - _f2b_enabled | bool
    - _f2b_role_runs | bool
  ansible.builtin.debug:
    msg:
      installed: "{{ ('fail2ban ' ~ _f2b_version_before) if (_f2b_installed_before | bool) else 'no: role 03 installs fail2ban, then runs this check again before it writes anything' }}"
      service: "{{ ('active' if (_f2b_active_before | bool) else 'NOT active') ~ ', ' ~ ('enabled' if (_f2b_unit_enabled_before | bool) else 'NOT enabled') ~ ' at boot' }}"
      plan: "{{ _f2b_plan }}"
      sshd_jail_after_this_run: "{{ _f2b_trial.sshd.effective | default({}) }}"
      set_in: "{{ _f2b_trial.sshd.set_in | default({}) }}"
      changes: "{{ _f2b_change_lines | default([]) }}"

- name: "fail2ban preflight: summary for slow scanners"
  when:
    - _f2b_slow | bool
    - _f2b_role_runs | bool
  ansible.builtin.debug:
    msg:
      plan: "{{ _f2b_slow_plan }}"
      jails: "{{ _f2b_slow_jail_note or 'checked after fail2ban is installed' }}"
      memory: "{{ _f2b_slow_db_note or 'checked after fail2ban is installed' }}"
      set_in: "{{ (_f2b_slow_trial.slow | default({}, true)).set_in | default({}) }}"
      changes: "{{ _f2b_slow_change_lines | default([]) }}"
