---
# Layer 05: app runtime (Node/Docker + nginx + TLS), only when app_type is
# set. 0.6: follows plan.yml (site.yml pre_tasks), which refuses a host
# whose nginx is not auto_sec's (R05-1), whose deploy_user is missing for
# the docker group (R05-2), whose account app is not a system account
# without login (R05-3) or whose app_dir is not app's (R05-4); checked
# again here (M05-1). apt installs go through the package guard. Layer 05
# creates no login account and changes no existing account or folder.

- name: "App: the plan must have run in this play"
  ansible.builtin.assert:
    quiet: true
    that: _l05_planned | default(false) | bool
    fail_msg: >-
      Role 05 needs its plan (site.yml includes roles/05-app-runtime/tasks/plan.yml in
      pre_tasks). Nothing has been changed.

- name: "App: nginx, the vhost, app and app_dir again, right before the change"
  ansible.builtin.command:
    argv: "{{ ['sh', '-c', _l05_read_sh, 'sh', _l05_header, '/etc/nginx/sites-available/' ~ client_domain, deploy_user, app_dir] }}"
  environment:
    LC_ALL: C
  register: _l05_again
  changed_when: false
  check_mode: false

- name: "App M05-1: nginx, app and app_dir are as the plan saw them"
  ansible.builtin.assert:
    quiet: true
    that:
      - _l05_again_now.nginx == _l05_plan_snapshot.nginx
      - _l05_again_now.vhost == _l05_plan_snapshot.vhost
      - _l05_again_now.app == _l05_plan_snapshot.app
      - _l05_again_now.appdir == _l05_plan_snapshot.appdir
    fail_msg: >-
      nginx, the account app or app_dir on {{ inventory_hostname }} changed during this run. Nothing
      was changed by layer 05. Run again.
  vars:
    _l05_again_now: >-
      {%- set out = {} -%}
      {%- for ln in _l05_again.stdout_lines | select('match', '^(nginx|vhost|app|appdir) ') -%}
      {%- set f = ln.split(' ', 1) -%}
      {%- set _ = out.update({f[0]: (f[1] if f | length > 1 else '')}) -%}
      {%- endfor -%}
      {{ out }}

- name: "App: install nginx and certbot (package guard)"
  when: not ansible_check_mode
  ansible.builtin.include_role:
    name: autosec-apt
    tasks_from: install
  vars:
    _aptg_want: "{{ _l05_pkg_want }}"
    _aptg_who: role 05 (app)

# Only when missing (plan R05-3): an existing account is never changed.
- name: Create app service user (non-root, no login shell)
  when: (_l05_plan_snapshot.app | default('absent')) == 'absent'
  ansible.builtin.user:
    name: app
    shell: /usr/sbin/nologin
    system: true
    create_home: false

# Only when missing (plan R05-4): an existing app_dir already belongs to app.
- name: Create app directory
  when: (_l05_plan_snapshot.appdir | default('absent')) == 'absent'
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: app
    group: app
    mode: "0750"

# --- Node/PM2 branch ---
- name: Node runtime block
  when: app_type == "node"
  block:
    # Leave an existing Node.js alone, whatever installed it (same behaviour
    # as the previous `creates: /usr/bin/node`).
    - name: Check for an existing Node.js
      ansible.builtin.stat:
        path: /usr/bin/node
      register: node_bin

    # Fetch then run, instead of `curl | bash`: the script is a file we can
    # inspect, and node_version (validated as digits in site.yml preflight)
    # never reaches a shell.
    - name: Install Node.js from NodeSource
      when: not node_bin.stat.exists
      block:
        - name: Fetch the NodeSource setup script
          ansible.builtin.get_url:
            url: "https://deb.nodesource.com/setup_{{ node_version | int }}.x"
            dest: /opt/nodesource_setup.sh
            mode: "0700"
            owner: root
            group: root

        - name: Run the NodeSource setup script
          ansible.builtin.command:
            argv: [/bin/bash, /opt/nodesource_setup.sh]
            creates: /etc/apt/sources.list.d/nodesource.list

        # NodeSource's repository is new, so this is a second guarded
        # install (it refreshes the package lists itself).
        - name: Install Node.js (package guard)
          when: not ansible_check_mode
          ansible.builtin.include_role:
            name: autosec-apt
            tasks_from: install
          vars:
            _aptg_want: [nodejs]
            _aptg_who: role 05 (NodeSource)

    - name: Install PM2 globally
      community.general.npm:
        name: pm2
        global: true

    # argv form: app_dir can never be split into an extra flag. Without it,
    # app_dir "/opt/app -u root" appends a second --user and pm2 generates a
    # unit that runs the application as root.
    - name: PM2 startup on boot as app user
      ansible.builtin.command:
        argv: [pm2, startup, systemd, -u, app, --hp, "{{ app_dir }}"]
        creates: /etc/systemd/system/pm2-app.service

# --- Docker branch ---
- name: Docker runtime block
  when: app_type == "docker"
  block:
    - name: Install Docker
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    # Docker group membership is root-equivalent (the plan says so). The
    # user module would CREATE a missing account: layer 05 only adds an
    # existing one to the group.
    - name: Does deploy_user exist?
      ansible.builtin.command:
        argv: [getent, passwd, "{{ deploy_user }}"]
      register: _l05_getent
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Add deploy user to docker group (existing account only)
      when: _l05_getent.rc == 0
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: "App M05-2: deploy_user must exist for the docker group (outside --check)"
      when: _l05_getent.rc != 0
      ansible.builtin.assert:
        quiet: true
        that: ansible_check_mode
        fail_msg: >-
          {{ deploy_user }} does not exist on {{ inventory_hostname }}, so it was not added to the
          docker group. Layer 05 creates no account: set deploy_user_account: create (role 01),
          then run again.

- name: Hardened Nginx reverse proxy vhost
  ansible.builtin.template:
    src: nginx-vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ client_domain }}"
    mode: "0644"
  notify: reload nginx

- name: Enable vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ client_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ client_domain }}"
    state: link
  notify: reload nginx

- name: Remove default vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Hide Nginx version globally
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: "server_tokens"
    line: "    server_tokens off;"
    insertafter: "http {"
  notify: reload nginx

# argv form: a value like "site.com --deploy-hook /tmp/x.sh" cannot become
# extra flags. certbot persists --deploy-hook into the renewal config, which
# would give an attacker root execution on every future renewal.
- name: Obtain TLS certificate
  ansible.builtin.command:
    argv:
      - certbot
      - --nginx
      - -d
      - "{{ client_domain }}"
      - --non-interactive
      - --agree-tos
      - -m
      - "{{ letsencrypt_email }}"
      - --redirect
    creates: "/etc/letsencrypt/live/{{ client_domain }}/fullchain.pem"

# --- fail2ban jails for nginx (issue #2) ---
# Role 03 never writes nginx jails. They are added here, once nginx runs:
# the flush applies the nginx changes above (nginx is running and its log
# files exist), then role 03's own tasks run the same read-only trial,
# checks and reload-only-on-change as for 00-autosec.conf, and write only
# /etc/fail2ban/jail.d/00-autosec-nginx.conf (backend = auto). That file
# skips itself when fail2ban_hardening_enabled or fail2ban_nginx_jails is
# false, and stops the run when role 03's preflight has not run.
- name: Apply the nginx changes before the nginx jails read its logs
  ansible.builtin.meta: flush_handlers

# In --check nginx is not really installed, and fail2ban's config test
# would fail on the missing nginx logs: skip the jails there.
- name: Is nginx installed? (the nginx jails read its log files)
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}", nginx]
  register: _app_nginx_pkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: fail2ban jails for nginx, skipped while nginx is not installed
  when: (_app_nginx_pkg.stdout | default('')) is not match('^.i')
  ansible.builtin.debug:
    msg: >-
      nginx is not installed on {{ inventory_hostname }}{{ ' yet (check mode: the real run
      installs it first)' if ansible_check_mode else '' }}, so the fail2ban nginx jails are
      not added in this run.

# Tagged fail2ban as well (it keeps "app" from site.yml), so that
# --skip-tags fail2ban leaves fail2ban alone here too. --tags fail2ban does
# not reach this role: the nginx jails are updated by runs that include
# "app".
- name: fail2ban jails for nginx (jail.d/00-autosec-nginx.conf)
  when: (_app_nginx_pkg.stdout | default('')) is match('^.i')
  ansible.builtin.include_role:
    name: 03-firewall
    tasks_from: fail2ban-nginx
    apply:
      tags: [fail2ban]
  tags: [fail2ban]
