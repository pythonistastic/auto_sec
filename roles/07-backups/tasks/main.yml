---
# Layer 07: encrypted off-site backups, only when b2_bucket is set. 0.6:
# follows plan.yml (site.yml pre_tasks), which refuses a host whose
# rclone.conf (R07-1) or another file of layer 07 (R07-2) is not
# auto_sec's; checked again here (M07-1). apt installs go through the
# package guard (rclone, age and curl, which the backup script uses for its
# alerts).

- name: "Backups: the plan must have run in this play"
  ansible.builtin.assert:
    quiet: true
    that: _l07_planned | default(false) | bool
    fail_msg: >-
      Role 07 needs its plan (site.yml includes roles/07-backups/tasks/plan.yml in
      pre_tasks). Nothing has been changed.

- name: "Backups: the files again, right before the write"
  ansible.builtin.include_tasks:
    file: read.yml

- name: "Backups M07-1: the files are as the plan saw them"
  ansible.builtin.assert:
    quiet: true
    that:
      - _l07_now == _l07_plan_snapshot
      - _l07_files == _l07_files_snapshot
    fail_msg: >-
      A file layer 07 writes on {{ inventory_hostname }} (rclone.conf, /opt/backup or
      /etc/logrotate.d/backup) changed during this run. Nothing was written. Run again.

- name: Install rclone, age and curl (package guard)
  when: not ansible_check_mode
  ansible.builtin.include_role:
    name: autosec-apt
    tasks_from: install
  vars:
    _aptg_want: "{{ _l07_pkg_want }}"
    _aptg_who: role 07 (backups)

- name: Create backup working directory
  ansible.builtin.file:
    path: /opt/backup
    state: directory
    owner: root
    group: root
    mode: "0700"

# The rclone config lives under /root/.config, which does not exist on a
# minimal image until something creates it.
- name: Ensure rclone config directory exists
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Configure rclone remote for B2 (scoped key, read+write, NO delete)
  ansible.builtin.copy:
    dest: /root/.config/rclone/rclone.conf
    mode: "0600"
    content: |
      {{ _l07_header }}
      [b2]
      type = b2
      account = {{ b2_key_id }}
      key = {{ b2_app_key }}
  no_log: true

# The age recipient is written to a file and consumed with `age -R`, so it
# can never be appended to as an extra `-r` argument on a command line.
# One recipient per line; a newline in the value would add a recipient, which
# is why site.yml validates the charset before we get here.
- name: Install the backup encryption recipient
  ansible.builtin.copy:
    dest: /opt/backup/recipients.txt
    mode: "0600"
    owner: root
    group: root
    content: "{{ age_public_key }}\n"
  no_log: true

# Alert credentials are read at runtime by the script, never rendered into
# its source (where $(...) inside double quotes would execute as root).
- name: Install alert credentials for the backup script
  ansible.builtin.copy:
    dest: "/opt/backup/{{ item.name }}"
    mode: "0600"
    owner: root
    group: root
    content: "{{ item.value }}"
  loop:
    - { name: ".tg_token", value: "{{ telegram_bot_token | default('CHANGE_ME') }}" }
    - { name: ".tg_chat", value: "{{ telegram_chat_id | default('') }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Install backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /opt/backup/backup.sh
    mode: "0700"

# hour/minute are forced through `| int`: the cron module joins the five time
# fields with single spaces, so whitespace in a time field shifts the command
# column and injects a job.
- name: Nightly backup cron
  ansible.builtin.cron:
    name: "nightly encrypted backup to B2"
    hour: "{{ backup_hour | int }}"
    minute: "{{ backup_minute | int }}"
    job: "/opt/backup/backup.sh >> /var/log/backup.log 2>&1"

- name: Logrotate for backup log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/backup
    mode: "0644"
    content: |
      {{ _l07_header }}
      /var/log/backup.log {
          weekly
          rotate 8
          compress
          missingok
      }
