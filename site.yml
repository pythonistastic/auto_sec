---
# Master playbook. Runs every layer in order, one host at a time.
# Usage: ansible-playbook -i inventory/<server>.yml site.yml -l <server>
#
# Every run starts with checks that only read (pre_tasks), and then prints
# the plan: one line per role, the totals and a plan id. Nothing changes
# before that point.
#   -e autosec_plan_only=true          print the plan and stop
#   autosec_require_approval: true     (host_vars) a run that would change
#                                      the server needs -e autosec_approve=<plan id>
#
# Each host needs autosec_server: existing or new (host_vars). existing
# changes nothing unless you name it; new sets up a brand-new server.
#
# Optional layers are loaded dynamically and only when their feature is
# configured, so a missing optional collection or a misconfigured optional
# role can never break core hardening.

- name: Secure deployment pipeline
  hosts: all
  become: true
  gather_facts: false
  # One host at a time; the first failed or unreachable host stops the
  # hosts after it (#12). autosec_serial is read before any host variable:
  # pass it with -e. No any_errors_fatal: with serial, ansible-core 2.16 and
  # 2.21 then count an unreachable host twice and go on to the next batch
  # (tests/site/semantics case s4).
  serial: "{{ autosec_serial | default(1) }}"
  max_fail_percentage: 0

  vars:
    # When each optional layer is configured. The single source for the
    # layer includes (tasks:) and for their plan includes (pre_tasks).
    _layer_04: "{{ (paranoia_level | default('standard')) == 'high' }}"
    _layer_05: "{{ app_type is defined }}"
    _layer_06: "{{ db_engine is defined }}"
    _layer_07: "{{ b2_bucket is defined }}"
    _layer_10: true
    _layer_11: "{{ (cve_watch_enabled | default(false) | string | lower) in ['true', 'yes', '1', 'on'] }}"
    # Whether --tags/--skip-tags select a layer. The plan includes run with
    # tags always, so they check it here: a layer the tags leave out plans
    # nothing and installs nothing.
    _autosec_run_all: "{{ ('all' in ansible_run_tags) or ('tagged' in ansible_run_tags) }}"
    _autosec_skip_all: "{{ ('all' in ansible_skip_tags) or ('tagged' in ansible_skip_tags) }}"
    _sel_04: "{{ not (_autosec_skip_all | bool) and 'fwknop' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'fwknop' in ansible_run_tags) }}"
    _sel_05: "{{ not (_autosec_skip_all | bool) and 'app' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'app' in ansible_run_tags) }}"
    _sel_06: "{{ not (_autosec_skip_all | bool) and 'database' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'database' in ansible_run_tags) }}"
    _sel_07: "{{ not (_autosec_skip_all | bool) and 'backups' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'backups' in ansible_run_tags) }}"
    _sel_10: "{{ not (_autosec_skip_all | bool) and 'report' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'report' in ansible_run_tags) }}"
    _sel_11: "{{ not (_autosec_skip_all | bool) and 'cve' not in ansible_skip_tags and ((_autosec_run_all | bool) or 'cve' in ansible_run_tags) }}"

  # --- Preflight: every check BEFORE any change, so a refusal never leaves
  #     a server half-done. All of it is tagged always and also runs in
  #     --check. The order matters:
  #       1  host-count guard (controller only)
  #       2  variable checks (no host access)
  #       3  auto_sec 0.1-0.5's detectors in active mode (before facts)
  #       4  fact gathering
  #       5  checks that need facts
  #       6  role preflights 02 -> 01 -> 03 -> 08 -> 09, then the plans of
  #          roles 02, 04-07, 10 and 11
  #       7  one package check for the whole run
  #       8  the plan, plan-only stop and approval
  pre_tasks:
    # --- 1. Host-count guard (#12) -------------------------------------------
    # An assert runs on the controller: no connection to any host. Without
    # -l, a run over several hosts needs the count confirmed. (The play uses
    # the default linear strategy, so run_once means once per batch.) An
    # empty -l ("" or ",", for example from an unset shell variable) limits
    # nothing in Ansible, so it counts as no -l.
    - name: "Preflight R00-2: a run over several hosts needs -l"
      tags: [always]
      run_once: true  # noqa: run-once[task]
      ansible.builtin.assert:
        quiet: true
        that: >-
          (ansible_limit | default('') | string | regex_replace('[][,:]', ' ') | trim | length) > 0
          or (ansible_play_hosts_all | length) <= 1
          or (autosec_confirm_hosts | default('') | string) == (ansible_play_hosts_all | length | string)
        fail_msg: >-
          [R00-2] This run targets {{ ansible_play_hosts_all | length }} hosts
          ({{ ansible_play_hosts_all | join(', ') | truncate(300) }}) and no -l was given (an empty
          -l counts as none). Pass -l <host>, or confirm with
          -e autosec_confirm_hosts={{ ansible_play_hosts_all | length }}. Nothing has been changed.

    # --- 2. Variable checks (no host access) ---------------------------------
    # autosec_server (R00-1) and the plan switches.
    - name: "Preflight: autosec_server and the plan switches"
      ansible.builtin.import_role:
        name: 00-plan
        tasks_from: vars
      tags: [always]

    - name: "Preflight: variables required by the features you enabled"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (app_type is not defined)
            or (client_domain is defined and letsencrypt_email is defined
                and letsencrypt_email != 'CHANGE_ME@example.com')
          - >-
            (db_engine is not defined)
            or (db_name is defined and db_user is defined and db_password is defined)
          - >-
            (b2_bucket is not defined)
            or (b2_key_id is defined and b2_app_key is defined and age_public_key is defined)
          - >-
            (paranoia_level | default('standard') != 'high')
            or (fwknop_key is defined and fwknop_hmac_key is defined)
        fail_msg: >-
          A feature you enabled is missing a required variable (see the
          failed assertion above). Fix host_vars and re-run - nothing has
          been changed on the server yet.

    # Runs BEFORE the shape checks so an unfilled template gets a clear
    # "still a placeholder" message rather than a misleading "unsafe shape".
    # Only credentials an ENABLED feature actually needs are checked:
    # telegram_bot_token: CHANGE_ME is a legitimate "alerts off" setting.
    - name: "Preflight: required credentials are not template placeholders"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (b2_bucket is not defined)
            or ('CHANGE' not in (b2_key_id | string)
                and 'CHANGE' not in (b2_app_key | string)
                and 'CHANGE' not in (age_public_key | string | upper))
          - (db_engine is not defined) or ('CHANGE_ME' not in (db_password | string))
          - >-
            (paranoia_level | default('standard') != 'high')
            or ('CHANGE' not in (fwknop_key | string) and 'CHANGE' not in (fwknop_hmac_key | string))
        fail_msg: >-
          host_vars still contains a CHANGE_ME placeholder for a feature you
          enabled (see the failed assertion). Fill in the real value, or
          remove the feature's trigger variable (b2_bucket / db_engine /
          paranoia_level) to turn that feature off. Nothing has been changed.

    # --- Value validation --------------------------------------------------
    # Required vars are not enough: their VALUES reach shell commands, file
    # paths and newline-delimited config files. A value is only safe if its
    # SHAPE is constrained. These asserts are the single enforcement point -
    # roles may assume a validated value, and must still quote it.
    #
    # Security rule (see SECURITY.md): a value derived from a managed host
    # must never be promoted into a variable automatically. Facts may be
    # shown to the operator; a human types the value.

    - name: "Preflight: identifiers and paths must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Used as a path component (report file, backup prefix) and in
          # alerts, so it must be a plain hostname-like label. (The system
          # hostname is server_hostname, checked by role 01's preflight.)
          - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,252}$')
          - inventory_hostname is not search('\.\.')
          # Reaches sudoers, the sudo scan and /home/<user> paths.
          - deploy_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          # Reaches ufw, fail2ban's jail.d/00-autosec.conf and fwknop
          # access.conf. It must be the port sshd already listens on (role
          # 02's preflight checks that); auto_sec never moves sshd.
          - ssh_port | string is match('^[0-9]{1,5}$')
          - (ssh_port | int) > 0 and (ssh_port | int) < 65536
          # Reaches `tar -C`, pm2 --hp, the file module and the CVE watch.
          # Must be absolute, traversal-free, and never '/'.
          - app_dir is match('^/[A-Za-z0-9._/-]+$')
          - app_dir is not search('\.\.')
          - app_dir != '/'
          # Reaches the cron time fields, where whitespace alone injects a
          # command into field 6.
          - backup_hour | string is match('^([0-9]|1[0-9]|2[0-3])$')
          - backup_minute | string is match('^[0-5]?[0-9]$')
          # Role 01's preflight (below) checks the shape of these. Its
          # patterns end in $, which also accepts one trailing newline, so
          # newlines are refused here: the reboot time and the package
          # names reach an apt config file, and timezone is printed in the
          # client report.
          - timezone | default('keep') | string is not search('[\r\n]')
          - server_hostname | default('keep') | string is not search('[\r\n]')
          - (unattended_reboot_time is not defined) or (unattended_reboot_time | string is not search('[\r\n]'))
          - >-
            (unattended_upgrade_blacklist | default([])) is not sequence
            or (unattended_upgrade_blacklist | default([]) | map('string') | select('search', '[\r\n]') | list | length == 0)
        fail_msg: >-
          A variable has an unsafe shape. These values are interpolated into
          shell commands, file paths and newline-delimited config files, so a
          stray space, slash, quote or newline becomes executable. Fix the
          value in host_vars; nothing has been changed on the server.

    - name: "Preflight: feature values must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Used as a FILENAME under /etc/nginx/sites-{available,enabled} and
          # passed to certbot, so it must be a hostname and nothing else.
          - >-
            (client_domain is not defined)
            or (client_domain is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
                and client_domain | length <= 253)
          - (letsencrypt_email is not defined) or (letsencrypt_email is match('^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'))
          # Node major version only: reaches a shell pipeline.
          - (node_version is not defined) or (node_version | string is match('^[0-9]{1,2}$'))
          # Rendered into nginx's proxy_pass line.
          - (app_port is not defined) or (app_port | string is match('^[0-9]{1,5}$') and (app_port | int) > 0 and (app_port | int) < 65536)
          # A path component under /etc/postgresql/<version>/main.
          - (pg_version is not defined) or (pg_version | string is match('^[0-9]{1,3}$'))
          - (app_type is not defined) or (app_type in ['node', 'docker'])
          # SQL identifiers: reach pg_dump/mysqldump and a mysql priv DSL.
          - (db_engine is not defined) or (db_engine in ['postgres', 'mysql'])
          - (db_name is not defined) or (db_name is match('^[A-Za-z0-9_]{1,63}$'))
          - (db_user is not defined) or (db_user is match('^[A-Za-z0-9_]{1,63}$'))
          - (db_password is not defined) or (db_password is not search('[\r\n]'))
          # Reach the backup script and rclone remote.
          - (b2_bucket is not defined) or (b2_bucket is match('^[A-Za-z0-9][A-Za-z0-9-]{1,49}$'))
          # Deliberately permissive: Backblaze does not publish the key
          # charset, and rejecting a real key is a bug of its own. These land
          # in rclone.conf (an INI file), so only whitespace, newlines and
          # shell/quoting characters are excluded.
          - (b2_key_id is not defined) or (b2_key_id is match('^[A-Za-z0-9+/=_.-]{1,128}$'))
          - (b2_app_key is not defined) or (b2_app_key is match('^[A-Za-z0-9+/=_.-]{1,256}$'))
          # The recipient of every backup. A second recipient here reads
          # every future backup, so the charset must be exact.
          - (age_public_key is not defined) or (age_public_key is match('^age1[02-9ac-hj-np-z]{10,100}$'))
          # Base64 SPA keys, rendered into a line-oriented config.
          - (fwknop_key is not defined) or (fwknop_key is match('^[A-Za-z0-9+/=]{16,}$'))
          - (fwknop_hmac_key is not defined) or (fwknop_hmac_key is match('^[A-Za-z0-9+/=]{16,}$'))
          - (fwknop_open_seconds is not defined) or (fwknop_open_seconds | string is match('^[0-9]{1,5}$'))
        fail_msg: >-
          A feature variable has an unsafe shape (see the failed assertion).
          Nothing has been changed on the server.

    - name: "Preflight: alerting and report values must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Rendered into the backup and CVE watch scripts run by root.
          - >-
            (telegram_bot_token is not defined) or (telegram_bot_token == 'CHANGE_ME')
            or (telegram_bot_token is match('^[0-9]{5,}:[A-Za-z0-9_-]{20,}$'))
          - >-
            (telegram_chat_id is not defined) or (telegram_chat_id == 'CHANGE_ME')
            or (telegram_chat_id | string is match('^-?[0-9]{1,32}$'))
          - (office_static_ip is not defined) or (office_static_ip | length == 0) or (office_static_ip is match('^[0-9a-fA-F:.]{2,45}(/[0-9]{1,3})?$'))
          - (report_prepared_by is not defined) or (report_prepared_by is not search('[\r\n]'))
          # Rendered into the report: a newline would let a value inject
          # whole sections into it.
          - (client_name is not defined) or (client_name is not search('[\r\n]') and client_name | length <= 200)
          # Rendered into cve-watch.conf (an INI file read by the scanner).
          - (cve_watch_min_severity is not defined) or (cve_watch_min_severity | lower in ['low', 'moderate', 'medium', 'high', 'critical'])
        fail_msg: >-
          An alerting or report value has an unsafe shape (see the failed
          assertion). Nothing has been changed on the server.

    # Any other value (a typo, "High") used to skip the SSH firewall rule
    # and fwknop alike.
    - name: "Preflight: paranoia_level must be standard or high"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - paranoia_level in ['standard', 'high']
        fail_msg: >-
          paranoia_level is "{{ paranoia_level }}". Set it to "standard" or
          "high" (lowercase) in host_vars. Nothing has been changed on the
          server.

    # Lands in fail2ban's jail.d/00-autosec.conf (an INI file) next to
    # office_static_ip, so every entry must be a plain IPv4/IPv6 address or
    # CIDR range (role 03's preflight checks the same). Hostnames are
    # refused: fail2ban would resolve them through DNS on every check.
    # Same pattern as role 02's preflight (_ssh_cidr_re); keep them equal.
    - name: "Preflight: fail2ban_ignore_ips must be a list of IP addresses"
      tags: [always]
      vars:
        _f2b_ips: "{{ fail2ban_ignore_ips | default([]) }}"
        _ip_or_cidr: >-
          ^(((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(/(3[0-2]|[12]?[0-9]))?|(?=[0-9A-Fa-f:]*:)[0-9A-Fa-f:]{2,39}(/(12[0-8]|1[01][0-9]|[1-9]?[0-9]))?)$
      ansible.builtin.assert:
        quiet: true
        that:
          - _f2b_ips is sequence
          - _f2b_ips is not string
          - _f2b_ips is not mapping
          - _f2b_ips | map('string') | reject('match', _ip_or_cidr) | list | length == 0
        fail_msg: >-
          fail2ban_ignore_ips must be a list of IP addresses or CIDR ranges,
          for example ["203.0.113.7", "198.51.100.0/24"]. Got: {{ _f2b_ips }}.
          Nothing has been changed on the server.

    # The ufw values (firewall_state, firewall_inbound, ...) and the CVE
    # watch values. Variables only: no host access.
    - name: "Preflight: ufw variable checks"
      ansible.builtin.import_role:
        name: 03-firewall
        tasks_from: vars
      tags: [always]

    - name: "Preflight: CVE watch variable checks"
      ansible.builtin.import_role:
        name: 11-cve-watch
        tasks_from: vars
      tags: [always]

    # --- 3. auto_sec 0.1-0.5's detectors (R00-3), BEFORE fact gathering --
    # In active mode they end SSH sessions that look like reconnaissance,
    # and fact gathering alone looks like that. A stat, a grep and
    # `systemctl is-active` only (tests/legacy proves they trip nothing).
    - name: "Preflight R00-3: auto_sec 0.1-0.5's detectors must not run in active mode"
      ansible.builtin.import_role:
        name: 09-watcher
        tasks_from: legacy_active
      tags: [always]

    # --- 4. Facts ----------------------------------------------------------------
    - name: "Preflight: gather facts"
      tags: [always]
      ansible.builtin.setup:

    # --- 5. Checks that need facts --------------------------------------------
    # The break-glass address must be where YOU connect from. The server's
    # own address there (the old wizard default in local mode) opens nothing
    # for you. Host facts are used only to refuse, never as a value.
    - name: "Preflight: office_static_ip must not be one of the server's own addresses"
      tags: [always]
      vars:
        _office_addr: "{{ office_static_ip | default('') | string | regex_replace('/[0-9]+$', '') | lower }}"
        _own_addrs: >-
          {{ ((ansible_facts['all_ipv4_addresses'] | default([]))
              + (ansible_facts['all_ipv6_addresses'] | default([]))
              + ['127.0.0.1', '::1', ansible_host | default('') | string])
             | map('lower') | list }}
      ansible.builtin.assert:
        quiet: true
        that:
          - _office_addr | length == 0 or _office_addr not in _own_addrs
        fail_msg: >-
          office_static_ip ({{ office_static_ip | default('') }}) is an address of this
          server itself. Set it to the fixed IP of the place you connect
          FROM (your office or home), or to "" to turn break-glass off.
          Nothing has been changed on the server.

    # --- 6. Role preflights (read-only) ------------------------------------------
    # A wrong value in a role's variables stops every run, whatever the
    # tags; a role's checks of the server stop a run only when the tags
    # select that role.
    #
    # Role 02 first: SSH variables and the live SSH setup (config, port,
    # socket, pending undo). Role 01 reads its results (the admin account).
    - name: "Preflight: SSH checks (read-only)"
      ansible.builtin.import_role:
        name: 02-ssh-hardening
        tasks_from: preflight
      tags: [always]

    # Role 01: account and sudo, updates, reboots, hostname, timezone, and
    # the apt trial run on a copy.
    - name: "Preflight: account, sudo, update, hostname and timezone checks (read-only)"
      ansible.builtin.import_role:
        name: 01-base
        tasks_from: preflight
      tags: [always]

    # Role 03: ufw (no command on an active ufw; the turn-on checks when it
    # is off and firewall_state is enabled), then fail2ban.
    - name: "Preflight: ufw and fail2ban checks (read-only)"
      ansible.builtin.import_role:
        name: 03-firewall
        tasks_from: preflight
      tags: [always]

    # Roles 08 and 09 change nothing in 0.6: warnings about what 0.1-0.5
    # left on the server.
    - name: "Preflight: auto_sec 0.1-0.5's audit rules (read-only)"
      ansible.builtin.import_role:
        name: 08-detection
        tasks_from: legacy
      tags: [always]

    - name: "Preflight: auto_sec 0.1-0.5's detectors (read-only)"
      ansible.builtin.import_role:
        name: 09-watcher
        tasks_from: legacy
      tags: [always]

    # Role 02's plan lines. After role 01: a key for deploy_user waits for
    # the account role 01 creates in this run.
    - name: "Plan: role 02 (SSH)"
      ansible.builtin.import_role:
        name: 02-ssh-hardening
        tasks_from: plan
      tags: [always]

    - name: "Plan: layer 04 (fwknop)"
      when: (_layer_04 | bool) and (_sel_04 | bool)
      ansible.builtin.include_role:
        name: 04-fwknop
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    - name: "Plan: layer 05 (app runtime)"
      when: (_layer_05 | bool) and (_sel_05 | bool)
      ansible.builtin.include_role:
        name: 05-app-runtime
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    - name: "Plan: layer 06 (database)"
      when: (_layer_06 | bool) and (_sel_06 | bool)
      ansible.builtin.include_role:
        name: 06-database
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    - name: "Plan: layer 07 (backups)"
      when: (_layer_07 | bool) and (_sel_07 | bool)
      ansible.builtin.include_role:
        name: 07-backups
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    - name: "Plan: layer 10 (report)"
      when: (_layer_10 | bool) and (_sel_10 | bool)
      ansible.builtin.include_role:
        name: 10-report
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    - name: "Plan: layer 11 (CVE watch)"
      when: (_layer_11 | bool) and (_sel_11 | bool)
      ansible.builtin.include_role:
        name: 11-cve-watch
        tasks_from: plan
        apply: { tags: [always] }
      tags: [always]

    # CVE watch off: say so when a 0.2-0.5 cve-watch timer is still there.
    - name: "Preflight: a CVE watch timer from 0.2-0.5 (read-only)"
      when: not (_layer_11 | bool) and (_sel_11 | bool)
      ansible.builtin.include_role:
        name: 11-cve-watch
        tasks_from: legacy
        apply: { tags: [always] }
      tags: [always]

    # --- 7. Packages ---------------------------------------------------------------
    # One apt simulation for every package the selected roles want. With
    # every choice keep, apt is not asked at all.
    - name: "Preflight: packages (read-only)"
      ansible.builtin.import_role:
        name: autosec-apt
        tasks_from: preflight
      tags: [always]

    # --- 8. The plan -------------------------------------------------------------
    - name: "Plan: summary, plan id and approval"
      ansible.builtin.import_role:
        name: 00-plan
        tasks_from: summary
      tags: [always]

  # --- Core: roles 01-03 follow their preflight. ---------------------------
  roles:
    - { role: 01-base, tags: ["base"] }
    - { role: 02-ssh-hardening, tags: ["ssh"] }
    - { role: 03-firewall, tags: ["firewall"] }

  # --- Optional layers: loaded dynamically, so parse-time module resolution
  #     in an optional role can't break the core run.
  tasks:
    - name: "Layer 04: Single Packet Authorization (fwknop)"
      ansible.builtin.include_role:
        name: 04-fwknop
        apply: { tags: ["fwknop"] }
      tags: ["fwknop"]
      when: _layer_04 | bool

    - name: "Layer 05: app runtime (Node/Docker + Nginx + TLS)"
      ansible.builtin.include_role:
        name: 05-app-runtime
        apply: { tags: ["app"] }
      tags: ["app"]
      when: _layer_05 | bool

    - name: "Layer 06: database (localhost-only, least privilege)"
      ansible.builtin.include_role:
        name: 06-database
        apply: { tags: ["database"] }
      tags: ["database"]
      when: _layer_06 | bool

    - name: "Layer 07: encrypted off-site backups"
      ansible.builtin.include_role:
        name: 07-backups
        apply: { tags: ["backups"] }
      tags: ["backups"]
      when: _layer_07 | bool

    # Roles 08 and 09 are not managed in 0.6 (issue #18): only the warnings
    # of pre_tasks, which already ran. These includes do nothing then.
    - name: "Layer 08: detection (not managed in 0.6)"
      ansible.builtin.include_role:
        name: 08-detection
        tasks_from: legacy
        apply: { tags: ["detection"] }
      tags: ["detection"]
      when: not (_l08_done | default(false) | bool)

    - name: "Layer 09: watcher (not managed in 0.6)"
      ansible.builtin.include_role:
        name: 09-watcher
        tasks_from: legacy
        apply: { tags: ["watcher"] }
      tags: ["watcher"]
      when: not (_l09_done | default(false) | bool)

    - name: "Layer 10: security report (written on this computer)"
      ansible.builtin.include_role:
        name: 10-report
        apply: { tags: ["report"] }
      tags: ["report"]
      when: _layer_10 | bool

    - name: "Layer 11: CVE watch (off unless cve_watch_enabled: true)"
      ansible.builtin.include_role:
        name: 11-cve-watch
        apply: { tags: ["cve"] }
      tags: ["cve"]
      when: _layer_11 | bool
