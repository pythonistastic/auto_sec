---
# Master playbook. Runs all layers in order.
# Usage: ansible-playbook -i inventory/hosts.yml site.yml -l <client>
#
# Core hardening (01-03) always runs. Optional layers are loaded
# dynamically and only when their feature is configured, so a missing
# optional collection or a misconfigured optional role can never break
# core hardening or the detectors.

- name: Secure deployment pipeline
  hosts: all
  become: true

  # --- Preflight: fail BEFORE any change if required vars are missing, so
  #     the server is never left half-hardened (SSH locked, run aborted).
  #     This block is also the single source of truth for "required vars".
  #     Three read-only role preflights are imported at the end: role 02
  #     (SSH variables and the live SSH setup), role 01 (updates, reboots,
  #     hostname, timezone) and role 03 (fail2ban).
  pre_tasks:
    - name: "Preflight: variables required by the features you enabled"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - (not (ssh_pattern_watcher_enabled | default(false))) or (watcher_pattern is defined)
          - >-
            (app_type is not defined)
            or (client_domain is defined and letsencrypt_email is defined
                and letsencrypt_email != 'CHANGE_ME@example.com')
          - >-
            (db_engine is not defined)
            or (db_name is defined and db_user is defined and db_password is defined)
          - >-
            (b2_bucket is not defined)
            or (b2_key_id is defined and b2_app_key is defined and age_public_key is defined)
          - >-
            (paranoia_level | default('standard') != 'high')
            or (fwknop_key is defined and fwknop_hmac_key is defined)
        fail_msg: >-
          A feature you enabled is missing a required variable (see the
          failed assertion above). Fix host_vars and re-run - nothing has
          been changed on the server yet.

    # Runs BEFORE the shape checks so an unfilled template gets a clear
    # "still a placeholder" message rather than a misleading "unsafe shape".
    # Only credentials an ENABLED feature actually needs are checked:
    # telegram_bot_token: CHANGE_ME is a legitimate "alerts off" setting.
    - name: "Preflight: required credentials are not template placeholders"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (b2_bucket is not defined)
            or ('CHANGE' not in (b2_key_id | string)
                and 'CHANGE' not in (b2_app_key | string)
                and 'CHANGE' not in (age_public_key | string | upper))
          - (db_engine is not defined) or ('CHANGE_ME' not in (db_password | string))
          - >-
            (paranoia_level | default('standard') != 'high')
            or ('CHANGE' not in (fwknop_key | string) and 'CHANGE' not in (fwknop_hmac_key | string))
        fail_msg: >-
          host_vars still contains a CHANGE_ME placeholder for a feature you
          enabled (see the failed assertion). Fill in the real value, or
          remove the feature's trigger variable (b2_bucket / db_engine /
          paranoia_level) to turn that feature off. Nothing has been changed.

    # --- Value validation --------------------------------------------------
    # Required vars are not enough: their VALUES reach shell commands, file
    # paths and newline-delimited config files. A value is only safe if its
    # SHAPE is constrained. These asserts are the single enforcement point -
    # roles may assume a validated value, and must still quote it.
    #
    # Security rule (see SECURITY.md): a value derived from a managed host
    # must never be promoted into a variable automatically. Facts may be
    # shown to the operator; a human types the value.

    - name: "Preflight: identifiers and paths must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Used as a path component (report file, backup prefix) and in
          # alerts, so it must be a plain hostname-like label. (The system
          # hostname is server_hostname, checked by role 01's preflight.)
          - inventory_hostname is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,252}$')
          - inventory_hostname is not search('\.\.')
          # Reaches sudoers, audit rules and /home/<user> paths.
          - deploy_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          # Reaches ufw, fail2ban's jail.d/00-autosec.conf and fwknop
          # access.conf. It must be the port sshd already listens on (role
          # 02's preflight checks that); auto_sec never moves sshd.
          - ssh_port | string is match('^[0-9]{1,5}$')
          - (ssh_port | int) > 0 and (ssh_port | int) < 65536
          # Reaches `tar -C`, pm2 --hp, the file module and the canary.
          # Must be absolute, traversal-free, and never '/'.
          - app_dir is match('^/[A-Za-z0-9._/-]+$')
          - app_dir is not search('\.\.')
          - app_dir != '/'
          # Reaches the cron time fields, where whitespace alone injects a
          # command into field 6.
          - backup_hour | string is match('^([0-9]|1[0-9]|2[0-3])$')
          - backup_minute | string is match('^[0-5]?[0-9]$')
          # Role 01's preflight (below) checks the shape of these. Its
          # patterns end in $, which also accepts one trailing newline, so
          # newlines are refused here: the reboot time and the package
          # names reach an apt config file, and timezone is printed in the
          # client report.
          - timezone | default('keep') | string is not search('[\r\n]')
          - server_hostname | default('keep') | string is not search('[\r\n]')
          - (unattended_reboot_time is not defined) or (unattended_reboot_time | string is not search('[\r\n]'))
          - >-
            (unattended_upgrade_blacklist | default([])) is not sequence
            or (unattended_upgrade_blacklist | default([]) | map('string') | select('search', '[\r\n]') | list | length == 0)
        fail_msg: >-
          A variable has an unsafe shape. These values are interpolated into
          shell commands, file paths and newline-delimited config files, so a
          stray space, slash, quote or newline becomes executable. Fix the
          value in host_vars; nothing has been changed on the server.

    - name: "Preflight: feature values must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Used as a FILENAME under /etc/nginx/sites-{available,enabled} and
          # passed to certbot, so it must be a hostname and nothing else.
          - >-
            (client_domain is not defined)
            or (client_domain is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
                and client_domain | length <= 253)
          - (letsencrypt_email is not defined) or (letsencrypt_email is match('^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'))
          # Node major version only: reaches a shell pipeline.
          - (node_version is not defined) or (node_version | string is match('^[0-9]{1,2}$'))
          # Rendered into nginx's proxy_pass line.
          - (app_port is not defined) or (app_port | string is match('^[0-9]{1,5}$') and (app_port | int) > 0 and (app_port | int) < 65536)
          # A path component under /etc/postgresql/<version>/main.
          - (pg_version is not defined) or (pg_version | string is match('^[0-9]{1,3}$'))
          - (app_type is not defined) or (app_type in ['node', 'docker'])
          # SQL identifiers: reach pg_dump/mysqldump and a mysql priv DSL.
          - (db_engine is not defined) or (db_engine in ['postgres', 'mysql'])
          - (db_name is not defined) or (db_name is match('^[A-Za-z0-9_]{1,63}$'))
          - (db_user is not defined) or (db_user is match('^[A-Za-z0-9_]{1,63}$'))
          - (db_password is not defined) or (db_password is not search('[\r\n]'))
          # Reach the backup script and rclone remote.
          - (b2_bucket is not defined) or (b2_bucket is match('^[A-Za-z0-9][A-Za-z0-9-]{1,49}$'))
          # Deliberately permissive: Backblaze does not publish the key
          # charset, and rejecting a real key is a bug of its own. These land
          # in rclone.conf (an INI file), so only whitespace, newlines and
          # shell/quoting characters are excluded.
          - (b2_key_id is not defined) or (b2_key_id is match('^[A-Za-z0-9+/=_.-]{1,128}$'))
          - (b2_app_key is not defined) or (b2_app_key is match('^[A-Za-z0-9+/=_.-]{1,256}$'))
          # The recipient of every backup. A second recipient here reads
          # every future backup, so the charset must be exact.
          - (age_public_key is not defined) or (age_public_key is match('^age1[02-9ac-hj-np-z]{10,100}$'))
          # Base64 SPA keys, rendered into a line-oriented config.
          - (fwknop_key is not defined) or (fwknop_key is match('^[A-Za-z0-9+/=]{16,}$'))
          - (fwknop_hmac_key is not defined) or (fwknop_hmac_key is match('^[A-Za-z0-9+/=]{16,}$'))
          - (fwknop_open_seconds is not defined) or (fwknop_open_seconds | string is match('^[0-9]{1,5}$'))
        fail_msg: >-
          A feature variable has an unsafe shape (see the failed assertion).
          Nothing has been changed on the server.

    - name: "Preflight: alerting and detector values must have a safe shape"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          # Rendered into shell scripts run by root from cron and systemd.
          - >-
            (telegram_bot_token is not defined) or (telegram_bot_token == 'CHANGE_ME')
            or (telegram_bot_token is match('^[0-9]{5,}:[A-Za-z0-9_-]{20,}$'))
          - >-
            (telegram_chat_id is not defined) or (telegram_chat_id == 'CHANGE_ME')
            or (telegram_chat_id | string is match('^-?[0-9]{1,32}$'))
          # watcher.conf is a newline-delimited INI and is the only control
          # surface for all three detectors: a newline rewrites their config.
          - (watcher_pattern is not defined) or (watcher_pattern is not search('[\r\n]'))
          - (watcher_mode is not defined) or (watcher_mode in ['alert', 'active'])
          - (office_static_ip is not defined) or (office_static_ip | length == 0) or (office_static_ip is match('^[0-9a-fA-F:.]{2,45}(/[0-9]{1,3})?$'))
          - (revshell_allowed_parent_cmdlines is not defined) or (revshell_allowed_parent_cmdlines is not search('[\r\n,]'))
          - (recon_patterns is not defined) or (recon_patterns is not search('[\r\n]'))
          - (report_prepared_by is not defined) or (report_prepared_by is not search('[\r\n]'))
          # Rendered into the client-facing report: a newline would let a
          # value inject whole sections into a document a client relies on.
          - (client_name is not defined) or (client_name is not search('[\r\n]') and client_name | length <= 200)
          # Rendered into cve-watch.conf (an INI file read by the scanner).
          - (cve_watch_min_severity is not defined) or (cve_watch_min_severity | lower in ['low', 'moderate', 'medium', 'high', 'critical'])
        fail_msg: >-
          An alerting or detector value has an unsafe shape (see the failed
          assertion). Nothing has been changed on the server.

    # Any other value (a typo, "High") used to skip the SSH firewall rule
    # and fwknop alike.
    - name: "Preflight: paranoia_level must be standard or high"
      tags: [always]
      ansible.builtin.assert:
        quiet: true
        that:
          - paranoia_level in ['standard', 'high']
        fail_msg: >-
          paranoia_level is "{{ paranoia_level }}". Set it to "standard" or
          "high" (lowercase) in host_vars. Nothing has been changed on the
          server.

    # Lands in fail2ban's jail.d/00-autosec.conf (an INI file) next to
    # office_static_ip, so every entry must be a plain IPv4/IPv6 address or
    # CIDR range (role 03's preflight checks the same). Hostnames are
    # refused: fail2ban would resolve them through DNS on every check.
    # Same pattern as role 02's preflight (_ssh_cidr_re); keep them equal.
    - name: "Preflight: fail2ban_ignore_ips must be a list of IP addresses"
      tags: [always]
      vars:
        _f2b_ips: "{{ fail2ban_ignore_ips | default([]) }}"
        _ip_or_cidr: >-
          ^(((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(/(3[0-2]|[12]?[0-9]))?|(?=[0-9A-Fa-f:]*:)[0-9A-Fa-f:]{2,39}(/(12[0-8]|1[01][0-9]|[1-9]?[0-9]))?)$
      ansible.builtin.assert:
        quiet: true
        that:
          - _f2b_ips is sequence
          - _f2b_ips is not string
          - _f2b_ips is not mapping
          - _f2b_ips | map('string') | reject('match', _ip_or_cidr) | list | length == 0
        fail_msg: >-
          fail2ban_ignore_ips must be a list of IP addresses or CIDR ranges,
          for example ["203.0.113.7", "198.51.100.0/24"]. Got: {{ _f2b_ips }}.
          Nothing has been changed on the server.

    # The break-glass address must be where YOU connect from. The server's
    # own address there (the old wizard default in local mode) opens nothing
    # for you. Host facts are used only to refuse, never as a value.
    - name: "Preflight: office_static_ip must not be one of the server's own addresses"
      tags: [always]
      vars:
        _office_addr: "{{ office_static_ip | default('') | string | regex_replace('/[0-9]+$', '') | lower }}"
        _own_addrs: >-
          {{ ((ansible_facts['all_ipv4_addresses'] | default([]))
              + (ansible_facts['all_ipv6_addresses'] | default([]))
              + ['127.0.0.1', '::1', ansible_host | default('') | string])
             | map('lower') | list }}
      ansible.builtin.assert:
        quiet: true
        that:
          - _office_addr | length == 0 or _office_addr not in _own_addrs
        fail_msg: >-
          office_static_ip ({{ office_static_ip | default('') }}) is an address of this
          server itself. Set it to the fixed IP of the place you connect
          FROM (your office or home), or to "" to turn break-glass off.
          Nothing has been changed on the server.

    # --- SSH preflight (role 02) -------------------------------------------
    # Read-only checks of every SSH variable and of the live SSH setup
    # (config, port, socket, pending undo), before role 01 or anything else
    # changes the server. Tagged always, so `--tags firewall` still gets the
    # port checks that protect role 03. Also runs in --check.
    - name: "Preflight: SSH checks (read-only)"
      ansible.builtin.import_role:
        name: 02-ssh-hardening
        tasks_from: preflight
      tags: [always]

    # --- Updates, reboots, hostname and timezone preflight (role 01) -------
    # Checks every role 01 variable, reads the apt configuration and runs
    # role 01's apt file on a copy of it (trial run), before role 01 changes
    # anything. A wrong variable stops every run, whatever the tags; the
    # checks of the server stop a run only when the tags select role 01
    # ("base"). Read-only; also runs in --check.
    - name: "Preflight: update, reboot, hostname and timezone checks (read-only)"
      ansible.builtin.import_role:
        name: 01-base
        tasks_from: preflight
      tags: [always]

    # --- fail2ban preflight (role 03) ----------------------------------------
    # Checks the fail2ban variables and asks fail2ban's own config reader,
    # on a copy of /etc/fail2ban, what auto_sec's file would change. A wrong
    # variable stops every run, whatever the tags; the checks of the server
    # stop a run only when the tags select role 03's fail2ban part
    # ("firewall" or "fail2ban"). Read-only; also runs in --check.
    - name: "Preflight: fail2ban checks (read-only)"
      ansible.builtin.import_role:
        name: 03-firewall
        tasks_from: preflight
      tags: [always]

  # --- Core hardening: always applied.
  roles:
    - { role: 01-base, tags: ["base"] }
    - { role: 02-ssh-hardening, tags: ["ssh"] }
    - { role: 03-firewall, tags: ["firewall"] }

  # --- Optional + detection layers: loaded dynamically so parse-time
  #     module resolution in an optional role can't break the core run.
  tasks:
    - name: "Layer 04: Single Packet Authorization (fwknop)"
      ansible.builtin.include_role:
        name: 04-fwknop
        apply: { tags: ["fwknop"] }
      tags: ["fwknop"]
      when: paranoia_level | default('standard') == "high"

    - name: "Layer 05: app runtime (Node/Docker + Nginx + TLS)"
      ansible.builtin.include_role:
        name: 05-app-runtime
        apply: { tags: ["app"] }
      tags: ["app"]
      when: app_type is defined

    - name: "Layer 06: database (localhost-only, least privilege)"
      ansible.builtin.include_role:
        name: 06-database
        apply: { tags: ["database"] }
      tags: ["database"]
      when: db_engine is defined

    - name: "Layer 07: encrypted off-site backups"
      ansible.builtin.include_role:
        name: 07-backups
        apply: { tags: ["backups"] }
      tags: ["backups"]
      when: b2_bucket is defined

    - name: "Layer 08: detection (auditd tripwires, ransomware canary)"
      ansible.builtin.include_role:
        name: 08-detection
        apply: { tags: ["detection"] }
      tags: ["detection"]

    - name: "Layer 09: breach detection suite"
      ansible.builtin.include_role:
        name: 09-watcher
        apply: { tags: ["watcher"] }
      tags: ["watcher"]

    - name: "Layer 10: client security report"
      ansible.builtin.include_role:
        name: 10-report
        apply: { tags: ["report"] }
      tags: ["report"]

    - name: "Layer 11: CVE watch (dependency + OS vulnerability scan)"
      ansible.builtin.include_role:
        name: 11-cve-watch
        apply: { tags: ["cve"] }
      tags: ["cve"]
      when: cve_watch_enabled | default(true)
