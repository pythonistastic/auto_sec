---
# LAB ONLY (tests/fail2ban/semantics/lab.py, S16). Never run this against a
# server. It runs role 03's own fail2ban task files, unchanged, as the
# current user against a lab copy of /etc/fail2ban and an unprivileged
# fail2ban 1.0.2 server: lab.py passes -e with _f2b_conf_dir, _f2b_client,
# _f2b_run_dir ... pointing into its work directory, and puts stubs for
# dpkg-query and systemctl first in PATH (fail2ban "installed, active,
# enabled"). The steps that need root are left out: F1 (apt) and F11
# (systemd). Everything else is what fail2ban.yml runs. With
# fail2ban_slow_scanners: true, fail2ban-slow.yml runs as it is (it needs
# no root). lab_plan_out: a file for role 03's plan lines. lab_between: a
# command that runs between the preflight and the write.
- name: Role 03 fail2ban lab (unprivileged)
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: "Preflight: fail2ban checks (read-only), as site.yml runs them"
      ansible.builtin.import_role:
        name: 03-firewall
        tasks_from: preflight
      tags: [always]

    - name: "Lab: write role 03's plan lines"
      when: lab_plan_out is defined
      tags: [always]
      check_mode: false
      changed_when: false
      ansible.builtin.copy:
        dest: "{{ lab_plan_out }}"
        mode: "0600"
        content: "{{ {'plan': _plan_03, 'line': _f2b_plan} | to_nice_json }}"

  tasks:
    # Lab only: something else changes fail2ban after the plan (lab_between,
    # an argv list).
    - name: "Lab: a change between the preflight and the write"
      when: lab_between is defined
      tags: [always]
      ansible.builtin.command:
        argv: "{{ lab_between }}"
      changed_when: false

    - name: "Apply: fail2ban.yml F3-F10 and F12"
      when: _f2b_enabled | bool
      tags: [fail2ban]
      block:
        - name: "F3 trial run (after the other roles)"
          ansible.builtin.include_role:
            name: 03-firewall
            tasks_from: trial
          vars:
            _f2b_kind: main
            _f2b_stage: apply

        - name: "F3 refuse or go on"
          ansible.builtin.include_role:
            name: 03-firewall
            tasks_from: decide
          vars:
            _f2b_kind: main
            _f2b_stage: apply

        - name: "F4-F10 write, check, load and verify"
          ansible.builtin.include_role:
            name: 03-firewall
            tasks_from: apply
          vars:
            _f2b_kind: main

        - name: "F12 report line"
          ansible.builtin.include_role:
            name: 03-firewall
            tasks_from: report

    # What main.yml includes after the fail2ban part (fail2ban_slow_scanners: true).
    - name: "Apply: fail2ban-slow.yml"
      when: _f2b_slow | bool
      tags: [fail2ban]
      ansible.builtin.include_role:
        name: 03-firewall
        tasks_from: fail2ban-slow

    # What role 05 includes after it has installed nginx (lab_nginx: true).
    - name: "Role 05: auto_sec's nginx jails"
      when: lab_nginx | default(false) | bool
      ansible.builtin.include_role:
        name: 03-firewall
        tasks_from: fail2ban-nginx
